<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grandma's Recipe Tin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Reenie+Beanie&family=Homemade+Apple&display=swap" rel="stylesheet">
  <style>
    :root {
      --card: #fbf4e2; --red: #d9534f; --blue: #9cc3e0; --tin: #8a5a3c; --tin-dark: #5e3a24; --mustard: #e2b04a; --ink: #2f2a26;
      --type: "Special Elite", "Courier New", Courier, monospace;
      --hand: "Reenie Beanie", "Homemade Apple", "Segoe Script", "Bradley Hand", cursive;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--type);
      background: #d8c7a6 repeating-linear-gradient(0deg, rgb(255 255 255 / .12) 0 2px, transparent 2px 6px);
      padding: 1rem 1rem 3rem;
    }
    .back { display: inline-block; font-family: var(--hand); font-size: 1.7rem; color: var(--tin-dark); text-decoration: none; }
    .back:hover { text-decoration: underline wavy; }
    :focus-visible { outline: 3px dashed var(--red); outline-offset: 3px; }

    .wrap { width: min(860px, 100%); margin: 0 auto; }
    h1 { font-family: var(--hand); font-weight: 400; font-size: clamp(2.4rem, 8vw, 3.8rem); margin: 0 0 .5rem; color: var(--tin-dark); line-height: 1; text-align: center; transform: rotate(-1.5deg); }

    /* the tin */
    .tin { position: relative; margin-top: 1rem; z-index: 3; }
    .tin-back {
      height: 120px; border-radius: 14px 14px 0 0; position: relative;
      background: linear-gradient(180deg, #a06c4a, var(--tin));
      box-shadow: inset 0 0 0 4px var(--tin-dark), inset 0 -18px 24px rgb(0 0 0 / .25);
    }
    .tin-label {
      position: absolute; right: 1.5rem; top: .9rem; background: var(--card); border: 2px solid var(--tin-dark); padding: .15rem .8rem;
      font-family: var(--hand); font-size: 1.5rem; transform: rotate(2deg); box-shadow: 1px 2px 0 rgb(0 0 0 / .3);
    }
    .tabs { position: absolute; left: 1rem; right: 1rem; bottom: 0; display: flex; gap: .5rem; align-items: flex-end; flex-wrap: nowrap; }
    .tab {
      flex: 1 1 0; min-width: 0; font-family: var(--type); font-size: clamp(.7rem, 2.6vw, .95rem); color: var(--ink);
      background: var(--mustard); border: 2px solid #a8781f; border-bottom: 0; border-radius: 10px 10px 0 0;
      padding: .5rem .35rem; height: 52px; cursor: pointer; text-align: center; line-height: 1.1; overflow: hidden;
      box-shadow: 0 -2px 4px rgb(0 0 0 / .25); transition: height .25s, background .2s;
    }
    .tab b { display: block; font-size: 1.5em; line-height: 1; }
    .tab:hover { height: 60px; }
    .tab[aria-selected="true"] { height: 70px; background: #f0c565; }
    .tin-front {
      height: 46px; margin-top: -2px; border-radius: 0 0 14px 14px; position: relative; z-index: 4;
      background: linear-gradient(180deg, var(--tin), #6b4228); box-shadow: inset 0 0 0 4px var(--tin-dark), 0 14px 18px rgb(0 0 0 / .3);
      display: flex; align-items: center; justify-content: space-between; padding: 0 1.2rem; gap: .5rem;
    }
    .btn {
      font-family: var(--type); font-size: .95rem; background: var(--card); color: var(--ink); border: 2px solid var(--tin-dark);
      border-radius: 4px; padding: .3rem .8rem; cursor: pointer; box-shadow: 2px 2px 0 rgb(0 0 0 / .35);
    }
    .btn:hover { background: #fff; }
    .btn:active { transform: translate(2px, 2px); box-shadow: none; }
    .count { font-family: var(--hand); font-size: 1.6rem; color: var(--card); }

    /* card sits behind the tin front, slides up */
    .stage { position: relative; margin-top: -40px; z-index: 2; padding-top: 0; }
    .card {
      position: relative; background: var(--card); padding: 0 clamp(1rem, 4vw, 2.5rem) 2rem; border-radius: 4px 4px 2px 2px;
      box-shadow: 0 4px 14px rgb(0 0 0 / .3); transform-origin: bottom center;
      background-image: repeating-linear-gradient(transparent 0 31px, var(--blue) 31px 32px); background-position: 0 3.4rem;
    }
    .card.slide { animation: slideup .6s cubic-bezier(.2, .8, .3, 1.1); }
    @keyframes slideup { from { transform: translateY(160px); opacity: .2; } to { transform: none; opacity: 1; } }
    .card-head { position: relative; padding: 2.6rem 0 .4rem; border-bottom: 2px solid var(--red); background: var(--card); margin: 0 calc(-1 * clamp(1rem, 4vw, 2.5rem)); padding-left: clamp(1rem, 4vw, 2.5rem); padding-right: clamp(1rem, 4vw, 2.5rem); }
    .card-no { font-size: .8rem; letter-spacing: .2em; text-transform: uppercase; color: var(--red); margin: 0; }
    h2 { font-weight: 400; font-size: clamp(1.7rem, 6vw, 2.8rem); text-transform: uppercase; letter-spacing: .04em; margin: .1rem 0 0; line-height: 1.1; }
    .tagline { margin: 0; font-family: var(--hand); font-size: 1.8rem; color: #35506b; line-height: 1.2; padding: .4rem 0 0; }
    .margin-line { position: absolute; top: 0; bottom: 0; left: clamp(2.6rem, 7vw, 4rem); width: 2px; background: rgb(217 83 79 / .45); pointer-events: none; }
    .body { position: relative; display: grid; grid-template-columns: 1fr 1.25fr; gap: 1.5rem 2.2rem; padding-top: 1.2rem; padding-left: clamp(1.4rem, 5vw, 2.4rem); }
    dl.facts { margin: 0 0 1rem; display: grid; grid-template-columns: auto 1fr; gap: 0 .8rem; font-size: .9rem; line-height: 2; }
    dl.facts dt { text-transform: uppercase; letter-spacing: .08em; color: var(--red); }
    dl.facts dd { margin: 0; }
    h3 { font-weight: 400; font-size: 1rem; text-transform: uppercase; letter-spacing: .15em; margin: 0 0 .3rem; border-bottom: 1px dotted var(--ink); }
    ul.ingr { list-style: none; margin: 0; padding: 0; }
    ul.ingr li { line-height: 2; font-size: .92rem; }
    ul.ingr label { display: flex; gap: .55rem; align-items: baseline; cursor: pointer; }
    ul.ingr input { appearance: none; width: 1rem; height: 1rem; flex: none; border: 2px solid var(--ink); border-radius: 50%; margin: 0; transform: translateY(.15rem); cursor: pointer; }
    ul.ingr input:checked { background: radial-gradient(circle, var(--red) 0 45%, transparent 50%); border-color: var(--red); }
    ul.ingr input:checked + span { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; color: #7a7066; }
    ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
    ol.steps li { counter-increment: s; position: relative; padding-left: 2rem; font-size: .92rem; line-height: 32px; margin-bottom: 32px; }
    ol.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; font-family: var(--hand); font-size: 2rem; color: var(--red); }
    ol.steps li { margin-bottom: 0; padding-bottom: 0; }
    ol.steps li + li { margin-top: 0; }

    .note {
      position: absolute; right: clamp(.8rem, 3vw, 2rem); bottom: .6rem; max-width: 15rem; font-family: var(--hand); font-size: 1.7rem; line-height: 1.05;
      color: #2a4f78; transform: rotate(-4deg); background: none;
    }
    .note::before { content: "~ "; }
    .ring {
      position: absolute; right: 12%; top: 5.2rem; width: 92px; height: 92px; border-radius: 50%; pointer-events: none; transform: rotate(20deg);
      border: 5px solid rgb(120 72 36 / .28); border-right-color: rgb(120 72 36 / .12); border-bottom-color: rgb(120 72 36 / .34);
      box-shadow: inset 0 0 6px rgb(120 72 36 / .25), 1px 2px 4px rgb(120 72 36 / .12); filter: blur(.4px);
    }
    .ring::after { content: ""; position: absolute; inset: -14px 8px 70px -10px; border-radius: 50%; background: rgb(120 72 36 / .1); }
    .clip { position: absolute; top: -14px; left: clamp(2.2rem, 12vw, 6rem); width: 22px; height: 70px; z-index: 5; pointer-events: none;
      border: 3px solid #8e949b; border-radius: 12px; }
    .clip::before { content: ""; position: absolute; left: 3px; top: 12px; width: 10px; height: 52px; border: 3px solid #8e949b; border-radius: 8px; border-top-color: transparent; }
    .hint { text-align: center; font-family: var(--hand); font-size: 1.5rem; margin-top: 1.5rem; color: var(--tin-dark); }

    @media (max-width: 640px) {
      .body { grid-template-columns: 1fr; }
      .note { position: static; margin: 1.4rem 0 0; transform: rotate(-2deg); max-width: none; }
      .ring { right: 4%; top: 6rem; width: 70px; height: 70px; }
      .tin-back { height: 110px; }
      .tin-label { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { .card.slide { animation: none; } .tab { transition: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../../index.html">&larr; back to the gallery</a>
    <h1>Grandma's Recipe Tin</h1>

    <div class="tin">
      <div class="tin-back">
        <div class="tin-label">Bakes &amp; Breads</div>
        <div class="tabs" role="tablist" aria-label="Recipe dividers" id="tabs"></div>
      </div>
    </div>
    <div class="stage" id="stage">
      <article class="card" id="card" role="tabpanel" aria-live="polite"></article>
    </div>
    <div class="tin" style="margin-top:-6px">
      <div class="tin-front">
        <button class="btn" id="prev" type="button">&larr; Prev card</button>
        <span class="count" id="count"></span>
        <button class="btn" id="next" type="button">Next card &rarr;</button>
      </div>
    </div>
    <p class="hint">Tap the circles to cross things off as you gather them.</p>
  </div>

  <script src="../../recipes.js"></script>
  <script>
    (function () {
      var NOTES = {
        "sourdough": "Don't rush the folds, honey. Patience!",
        "focaccia": "More oil than you think. Then a bit more.",
        "chocolate-chip-cookies": "Chill the dough! Yes, really."
      };
      var tabsEl = document.getElementById("tabs");
      var card = document.getElementById("card");
      var count = document.getElementById("count");
      var current = 0;
      var tabEls = [];

      RECIPES.forEach(function (r, i) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "tab";
        b.setAttribute("role", "tab");
        b.id = "tab-" + i;
        b.innerHTML = "<b>" + r.name.charAt(0) + "</b>" + r.name;
        b.addEventListener("click", function () { show(i, true); });
        tabsEl.appendChild(b);
        tabEls.push(b);
      });

      function show(i, animate) {
        current = (i + RECIPES.length) % RECIPES.length;
        var r = RECIPES[current];
        var items = r.ingredients.map(function (x, k) {
          return '<li><label><input type="checkbox"><span>' + x + "</span></label></li>";
        }).join("");
        var steps = r.steps.map(function (x) { return "<li>" + x + "</li>"; }).join("");
        card.setAttribute("aria-labelledby", "tab-" + current);
        card.innerHTML =
          '<span class="clip" aria-hidden="true"></span>' +
          '<span class="margin-line" aria-hidden="true"></span>' +
          '<header class="card-head"><p class="card-no">Recipe card no. ' + (current + 1) + '</p><h2>' + r.name + '</h2><p class="tagline">' + r.tagline + '</p></header>' +
          '<span class="ring" aria-hidden="true"></span>' +
          '<div class="body"><div>' +
          '<dl class="facts"><dt>Time</dt><dd>' + r.time + '</dd><dt>Makes</dt><dd>' + r.yield + '</dd><dt>Skill</dt><dd>' + r.difficulty + '</dd></dl>' +
          '<h3>Ingredients</h3><ul class="ingr">' + items + '</ul></div>' +
          '<div><h3>Directions</h3><ol class="steps">' + steps + '</ol></div></div>' +
          '<p class="note">' + (NOTES[r.slug] || "") + '</p>';
        tabEls.forEach(function (t, k) {
          t.setAttribute("aria-selected", k === current ? "true" : "false");
          t.tabIndex = k === current ? 0 : -1;
        });
        count.textContent = "card " + (current + 1) + " of " + RECIPES.length;
        card.classList.remove("slide");
        if (animate) { void card.offsetWidth; card.classList.add("slide"); }
      }

      document.getElementById("prev").addEventListener("click", function () { show(current - 1, true); });
      document.getElementById("next").addEventListener("click", function () { show(current + 1, true); });
      tabsEl.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
          show(current + (e.key === "ArrowRight" ? 1 : -1), true);
          tabEls[current].focus();
        }
      });
      show(0, true);
    })();
  </script>
</body>
</html>
