<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Disco Diner Bakery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Karla:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --s1: #e8541c; --s2: #f2a900; --s3: #6b7d2a; --brown: #3b1f14; --cream: #fff1d6;
      --display: "Shrikhand", "Cooper Black", "Arial Rounded MT Bold", Georgia, serif;
      --body: "Karla", "Trebuchet MS", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--body); color: var(--brown); background: var(--cream); font-size: 1.05rem; line-height: 1.5; transition: background .4s; }
    :focus-visible { outline: 4px solid var(--brown); outline-offset: 3px; box-shadow: 0 0 0 7px var(--s2); }

    /* top bar */
    .bar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .5rem 1rem; background: var(--brown); color: var(--cream); }
    .back { color: var(--cream); font-weight: 800; text-decoration: none; background: var(--s1); padding: .35rem 1rem; border-radius: 999px; border: 3px solid var(--cream); transition: background .4s, transform .2s; }
    .back:hover { transform: scale(1.06) rotate(-2deg); }
    .dial { display: flex; align-items: center; gap: .7rem; }
    .dial-label { font-weight: 800; font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; text-align: right; line-height: 1.1; }
    .dial-label span { display: block; font-family: var(--display); font-size: 1.1rem; text-transform: none; letter-spacing: 0; color: var(--s2); transition: color .4s; }
    .knob { width: 52px; height: 52px; border-radius: 50%; border: 4px solid var(--cream); cursor: pointer; padding: 0; position: relative;
      background: conic-gradient(from 0deg, var(--s2), var(--s1), var(--s3), var(--s2)); box-shadow: 0 3px 0 rgb(0 0 0 / .5); }
    .knob::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--brown); }
    .knob i { position: absolute; left: 50%; top: 4px; width: 5px; height: 16px; margin-left: -2.5px; background: var(--cream); border-radius: 3px; transform-origin: 50% 22px; transform: rotate(var(--rot, 0deg)); transition: transform .35s cubic-bezier(.3, 1.6, .5, 1); }
    .knob:active { transform: translateY(2px); box-shadow: 0 1px 0 rgb(0 0 0 / .5); }

    /* sunburst hero */
    .hero { position: relative; overflow: hidden; min-height: 78vh; display: grid; place-items: center; text-align: center; padding: 3rem 1rem 12rem; isolation: isolate;
      background: repeating-conic-gradient(from 0deg at 50% 100%, var(--s2) 0 6deg, var(--cream) 6deg 12deg); }
    .arches { position: absolute; left: 50%; bottom: -50vmin; width: 150vmin; height: 150vmin; transform: translateX(-50%); border-radius: 50%; z-index: -1;
      background: repeating-radial-gradient(circle at 50% 50%, var(--brown) 0 5%, var(--cream) 5% 6.5%, var(--s3) 6.5% 11.5%, var(--s2) 11.5% 16.5%, var(--s1) 16.5% 21.5%, var(--brown) 21.5% 26.5%, transparent 26.5% 100%);
      -webkit-mask: radial-gradient(circle, #000 0 36%, transparent 36.2%); mask: radial-gradient(circle, #000 0 36%, transparent 36.2%); }
    .arches { background: radial-gradient(circle at 50% 50%, var(--cream) 0 8%, var(--brown) 8% 13%, var(--s3) 13% 18%, var(--s2) 18% 23%, var(--s1) 23% 28%, var(--brown) 28% 32%, var(--cream) 32% 36%, transparent 36%); -webkit-mask: none; mask: none; }
    .hero-text { position: relative; }
    .hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(3.2rem, 15vw, 9.5rem); line-height: .9; margin: 0; color: var(--cream); -webkit-text-stroke: 3px var(--brown); paint-order: stroke fill;
      text-shadow: 4px 4px 0 var(--s1), 8px 8px 0 var(--brown), 12px 12px 0 var(--s3); transform: rotate(-4deg); }
    .hero h1 span { display: block; color: var(--s2); }
    .hero p.sub { display: inline-block; margin: 2.2rem 0 0; background: var(--brown); color: var(--cream); font-weight: 800; padding: .5rem 1.4rem; border-radius: 999px; font-size: clamp(.9rem, 3.4vw, 1.2rem); letter-spacing: .08em; text-transform: uppercase; transform: rotate(-2deg); }

    /* wavy striped menu area */
    .menu { position: relative; padding: 5rem 1rem 4rem;
      background: repeating-linear-gradient(-12deg, var(--cream) 0 38px, var(--s2) 38px 58px, var(--s1) 58px 78px, var(--s3) 78px 98px); transition: background .4s; }
    .menu::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 34px; background: radial-gradient(circle 24px at 24px 0, var(--cream) 98%, transparent 100%) repeat-x; background-size: 48px 34px; }
    .menu h2.board { font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 auto 2.5rem; text-align: center; color: var(--cream); text-shadow: 3px 3px 0 var(--brown); transform: rotate(-1.5deg); }
    .sleeves { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 2.5rem 1.8rem; align-items: start; }

    .sleeve { --acc: var(--s1); position: relative; background: var(--cream); border: 6px solid var(--brown); border-radius: 36px; padding: 1.5rem 1.4rem 1.6rem; box-shadow: 10px 10px 0 var(--brown); transition: transform .25s, box-shadow .25s; }
    .sleeve:nth-child(2) { --acc: var(--s3); margin-top: 2.5rem; }
    .sleeve:nth-child(3) { --acc: var(--s2); }
    .sleeve:hover { transform: translate(-3px, -3px) rotate(-.6deg); box-shadow: 14px 14px 0 var(--brown); }
    .sleeve-top { display: flex; gap: 1rem; align-items: center; margin: -3.2rem 0 .8rem; }
    .vinyl { position: relative; flex: none; width: 140px; height: 140px; border-radius: 50%; border: 5px solid var(--brown); box-shadow: 4px 4px 0 var(--brown); }
    .grooves { position: absolute; inset: 0; border-radius: 50%; background: repeating-radial-gradient(circle, #1c0f0a 0 3px, #34201a 3px 5px); }
    .grooves::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgb(255 255 255 / .22), transparent 20%, transparent 50%, rgb(255 255 255 / .22) 50%, transparent 70%); }
    .vinyl:hover .grooves, .sleeve:focus-within .grooves { animation: spin 2.2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .label { position: absolute; inset: 33px; border-radius: 50%; background: var(--acc); border: 3px solid var(--brown); display: grid; place-items: center; text-align: center; color: var(--brown); font-family: var(--display); font-size: .95rem; line-height: 1; padding: 2px; transition: background .4s; }
    .label::after { content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--cream); border: 2px solid var(--brown); bottom: 6px; }
    .label b { font-weight: 400; display: block; max-width: 100%; }
    .sleeve-no { font-weight: 800; text-transform: uppercase; letter-spacing: .12em; font-size: .75rem; background: var(--brown); color: var(--cream); display: inline-block; padding: .15rem .7rem; border-radius: 99px; }
    .sleeve h3 { font-family: var(--display); font-weight: 400; font-size: clamp(1.8rem, 5vw, 2.3rem); line-height: 1; margin: .3rem 0 0; color: var(--brown); text-shadow: 2px 2px 0 var(--acc); }
    .tagline { margin: .4rem 0 1rem; font-weight: 500; font-style: italic; }
    .meta { display: flex; flex-wrap: wrap; gap: .4rem; margin: 0 0 1.2rem; padding: 0; list-style: none; font-weight: 800; font-size: .85rem; }
    .meta li { border: 3px solid var(--brown); border-radius: 99px; padding: .1rem .8rem; background: #fff; }
    .meta li:first-child { background: var(--acc); }
    .meta small { font-weight: 700; opacity: .8; }

    h4 { font-family: var(--display); font-weight: 400; font-size: 1.35rem; margin: 0 0 .6rem; color: var(--brown); }
    .side { background: var(--acc); border: 4px solid var(--brown); border-radius: 26px; padding: 1rem 1.1rem; margin-bottom: 1.5rem; transition: background .4s; }
    .side h4 { color: var(--cream); text-shadow: 2px 2px 0 var(--brown); }
    .side ul { list-style: none; margin: 0; padding: 0; }
    .side li { display: flex; gap: .7rem; align-items: center; font-weight: 700; padding: .25rem 0; line-height: 1.3; }
    .side li::before { content: ""; flex: none; width: 18px; height: 18px; border: 2px solid var(--brown); border-radius: 4px;
      background: conic-gradient(var(--brown) 25%, var(--cream) 0 50%, var(--brown) 0 75%, var(--cream) 0) ; background-size: 100% 100%; transform: rotate(8deg); }
    .side li:nth-child(even)::before { transform: rotate(-8deg); }
    ol.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; }
    ol.steps li { counter-increment: s; position: relative; padding: .2rem 0 .9rem 3.4rem; min-height: 2.6rem; }
    ol.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 2.6rem; height: 2.6rem; display: grid; place-items: center; border-radius: 50%; background: var(--acc); color: var(--cream); font-family: var(--display); font-size: 1.4rem; border: 3px solid var(--brown); box-shadow: 3px 3px 0 var(--brown); transition: background .4s; }
    ol.steps li::after { content: ""; position: absolute; left: calc(1.3rem - 2px); top: 2.7rem; bottom: .1rem; border-left: 4px dotted var(--brown); opacity: .4; }
    ol.steps li:last-child::after { display: none; }

    .foot { text-align: center; font-family: var(--display); padding: 2.5rem 1rem; background: var(--brown); color: var(--cream); font-size: 1.4rem; }
    .foot span { color: var(--s2); transition: color .4s; }

    @media (max-width: 700px) {
      .sleeve:nth-child(2) { margin-top: 1.5rem; }
      .sleeve-top { flex-direction: column; align-items: flex-start; margin-top: -3rem; gap: .6rem; }
      .hero { padding-bottom: 9rem; }
      .dial-label { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      .vinyl:hover .grooves, .sleeve:focus-within .grooves { animation: none; }
      .sleeve:hover, .back:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <a class="back" href="../../index.html">&larr; Back to gallery</a>
    <div class="dial">
      <p class="dial-label" id="dial-label" aria-live="polite" style="margin:0">Groove dial<span id="pal-name">Burnt Orange</span></p>
      <button class="knob" id="knob" type="button" aria-label="Groove dial: change the color palette. Current palette Burnt Orange"><i aria-hidden="true"></i></button>
    </div>
  </div>

  <header class="hero">
    <div class="arches" aria-hidden="true"></div>
    <div class="hero-text">
      <h1>Disco<span>Diner</span></h1>
      <p class="sub">Far-out bakes, served hot all night</p>
    </div>
  </header>

  <main class="menu">
    <h2 class="board">Today's Hit Singles</h2>
    <div class="sleeves" id="sleeves"></div>
  </main>
  <footer class="foot">Keep on <span>baking</span>, baby.</footer>

  <script src="../../recipes.js"></script>
  <script>
    (function () {
      var PALETTES = [
        { name: "Burnt Orange", s1: "#e8541c", s2: "#f2a900", s3: "#6b7d2a", brown: "#3b1f14", cream: "#fff1d6" },
        { name: "Avocado Lounge", s1: "#6b7d2a", s2: "#e8541c", s3: "#f2a900", brown: "#2c2a12", cream: "#f6efc8" },
        { name: "Mustard Night", s1: "#f2a900", s2: "#e8541c", s3: "#8c4a2a", brown: "#2a140d", cream: "#ffe8b8" }
      ];
      var idx = 0;
      var root = document.documentElement;
      var knob = document.getElementById("knob");
      var nameEl = document.getElementById("pal-name");

      function applyPalette(i) {
        var p = PALETTES[i];
        ["s1", "s2", "s3", "brown", "cream"].forEach(function (k) { root.style.setProperty("--" + k, p[k]); });
        knob.style.setProperty("--rot", (i - 1) * 55 + "deg");
        nameEl.textContent = p.name;
        knob.setAttribute("aria-label", "Groove dial: change the color palette. Current palette " + p.name);
      }
      knob.addEventListener("click", function () { idx = (idx + 1) % PALETTES.length; applyPalette(idx); });
      applyPalette(0);

      var wrap = document.getElementById("sleeves");
      RECIPES.forEach(function (r, i) {
        var m = r.time.match(/^(.*?)\s*\((.*)\)\s*$/);
        var big = m ? m[1] : r.time;
        var small = m ? m[2] : "";
        var el = document.createElement("article");
        el.className = "sleeve";
        el.innerHTML =
          '<div class="sleeve-top">' +
            '<div class="vinyl" role="img" aria-label="Record badge: ' + r.time + '"><div class="grooves"></div><div class="label"><b>' + big + '</b></div></div>' +
            '<div><span class="sleeve-no">Side ' + String.fromCharCode(65 + i) + ' / Track ' + (i + 1) + '</span></div>' +
          '</div>' +
          '<h3>' + r.name + '</h3><p class="tagline">' + r.tagline + '</p>' +
          '<ul class="meta"><li>' + r.time + '</li><li>Serves: ' + r.yield + '</li><li>' + r.difficulty + '</li></ul>' +
          '<div class="side"><h4>Side dishes</h4><ul>' + r.ingredients.map(function (x) { return "<li>" + x + "</li>"; }).join("") + '</ul></div>' +
          '<h4>Spin the steps</h4><ol class="steps">' + r.steps.map(function (x) { return "<li>" + x + "</li>"; }).join("") + '</ol>';
        wrap.appendChild(el);
      });
    })();
  </script>
</body>
</html>
