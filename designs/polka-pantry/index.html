<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polka Pantry — three bakes, in black and white</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0a0a0a; --white: #f7f5f0; --grey: #8c8a85;
      --display: "Abril Fatface", "Didot", "Bodoni MT", Georgia, serif;
      --body: "Josefin Sans", "Gill Sans", "Trebuchet MS", sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-snap-type: y proximity; scroll-behavior: smooth; }
    body { margin: 0; font-family: var(--body); font-weight: 300; font-size: 1.1rem; line-height: 1.6; background: var(--black); color: var(--white); }

    .back {
      position: fixed; top: 1rem; left: 1rem; z-index: 10; text-decoration: none;
      font-weight: 600; font-size: .75rem; letter-spacing: .25em; text-transform: uppercase;
      background: var(--white); color: var(--black); padding: .5rem 1rem; border: 1px solid var(--black); mix-blend-mode: normal;
    }
    .back:hover { background: var(--black); color: var(--white); border-color: var(--white); }
    .back:focus-visible { outline: 2px solid var(--grey); outline-offset: 3px; }

    /* two polka-dot grounds: dark and light, each a half-drop grid of dots */
    .dark  { --bg: var(--black); --fg: var(--white); --dot: rgb(247 245 240 / .16); --card: var(--white); --card-fg: var(--black); }
    .light { --bg: var(--white); --fg: var(--black); --dot: rgb(10 10 10 / .13);  --card: var(--black); --card-fg: var(--white); }
    .dark, .light {
      background-color: var(--bg); color: var(--fg);
      background-image: radial-gradient(circle, var(--dot) 0 9px, transparent 10px), radial-gradient(circle, var(--dot) 0 9px, transparent 10px);
      background-size: 64px 64px; background-position: 0 0, 32px 32px;
      animation: drift 40s linear infinite;
    }
    @keyframes drift { to { background-position: 64px 64px, 96px 96px; } }

    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    .recipe {
      min-height: 100vh; scroll-snap-align: start; padding: 6rem clamp(1.5rem, 6vw, 6rem) 4rem;
      display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(2rem, 5vw, 5rem); align-items: center;
    }
    .recipe.flip .heading { order: 2; }
    .numeral { font-family: var(--display); font-size: clamp(8rem, 24vw, 20rem); line-height: .8; margin: 0; color: transparent; -webkit-text-stroke: 2px var(--fg); }
    .heading h2 { font-family: var(--display); font-weight: 400; font-size: clamp(2.4rem, 5.5vw, 4.5rem); line-height: 1; margin: 1.25rem 0 .75rem; }
    .tagline { font-style: italic; margin: 0 0 1.5rem; max-width: 24rem; }
    .meta { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: .5rem; }
    .meta li { border: 1px solid var(--fg); border-radius: 999px; padding: .2rem 1rem; font-size: .7rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; background: var(--bg); }

    .card { background: var(--card); color: var(--card-fg); padding: clamp(1.5rem, 4vw, 3rem); border: 1px solid var(--fg); outline: 1px solid var(--card); outline-offset: 6px; }
    .card h3 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; margin: 0 0 1rem; display: flex; align-items: center; gap: .75rem; }
    .card h3::after { content: ""; flex: 1; height: 0; border-top: 4px dotted currentColor; }
    .card h3:not(:first-child) { margin-top: 2.25rem; }
    ul.ing { list-style: none; padding: 0; margin: 0; columns: 2 14rem; column-gap: 2rem; }
    ul.ing li { break-inside: avoid; padding: .45rem 0 .45rem 1.75rem; position: relative; border-bottom: 1px solid rgb(128 128 128 / .35); }
    ul.ing li::before { content: ""; position: absolute; left: 0; top: .95rem; width: .7rem; height: .7rem; border-radius: 50%; background: currentColor; }
    ol.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; }
    ol.steps li { counter-increment: s; position: relative; padding: .25rem 0 1rem 3.5rem; }
    ol.steps li::before {
      content: counter(s); position: absolute; left: 0; top: 0; width: 2.4rem; height: 2.4rem; border-radius: 50%;
      background: var(--card-fg); color: var(--card); font-family: var(--display); font-size: 1.25rem; display: grid; place-items: center;
    }

    footer { text-align: center; padding: 3rem 1rem; font-size: .7rem; letter-spacing: .5em; text-transform: uppercase; color: var(--grey); background: var(--black); }

    @media (max-width: 860px) {
      .recipe { grid-template-columns: 1fr; padding-top: 5rem; }
      .recipe.flip .heading { order: 0; }
      .numeral { font-size: 7rem; }
    }
    @media (prefers-reduced-motion: reduce) { .dark, .light { animation: none; } html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <a class="back" href="../../index.html">&larr; Gallery</a>

  <h1 class="sr-only">Polka Pantry</h1>
  <main id="recipes"></main>
  <footer>Fin &middot; Served in black and white</footer>

  <script src="../../recipes.js"></script>
  <script>
    const roman = ["I", "II", "III", "IV", "V"];
    const main = document.getElementById("recipes");
    RECIPES.forEach((r, i) => {
      const s = document.createElement("section");
      s.id = r.slug;
      s.className = "recipe " + (i % 2 ? "light flip" : "dark");
      s.innerHTML = `
        <div class="heading">
          <p class="numeral" aria-hidden="true">${roman[i]}</p>
          <h2>${r.name}</h2>
          <p class="tagline">${r.tagline}</p>
          <ul class="meta"><li>${r.time}</li><li>${r.yield}</li><li>${r.difficulty}</li></ul>
        </div>
        <article class="card">
          <h3>Ingredients</h3>
          <ul class="ing">${r.ingredients.map((x) => `<li>${x}</li>`).join("")}</ul>
          <h3>Method</h3>
          <ol class="steps">${r.steps.map((x) => `<li>${x}</li>`).join("")}</ol>
        </article>`;
      main.appendChild(s);
    });
  </script>
</body>
</html>
