<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprinkle Sundae — three bakes, wrapped like candy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --turq: #19c3c9; --pink: #ff4f9a; --sun: #ffd23f; --ink: #3a1d5c;
      --display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
      --body: "Quicksand", "Trebuchet MS", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: var(--body); font-weight: 600; color: var(--ink); line-height: 1.45; font-size: 1.05rem;
      min-height: 100vh; overflow-x: hidden;
      background: repeating-linear-gradient(-45deg, var(--turq) 0 34px, #2fd0d5 34px 68px);
    }
    a, button { font: inherit; }
    :focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; box-shadow: 0 0 0 7px var(--ink); }

    header.top {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
      padding: 1rem clamp(1rem, 4vw, 3rem);
    }
    .back {
      background: var(--sun); color: var(--ink); text-decoration: none; font-weight: 700;
      border: 3px solid var(--ink); border-radius: 12px 4px 12px 4px; padding: .35rem .9rem; box-shadow: 3px 3px 0 var(--ink);
      transition: transform .15s;
    }
    .back:hover { transform: rotate(-4deg) scale(1.06); }
    .brand { font-family: var(--display); font-size: clamp(2rem, 7vw, 4rem); line-height: .95; margin: 0; color: #fff; text-shadow: 4px 4px 0 var(--pink), 7px 7px 0 var(--ink); transform: rotate(-2deg); }
    .brand small { display: block; font-family: var(--body); font-weight: 700; font-size: .95rem; color: var(--ink); text-shadow: none; background: var(--sun); border: 3px solid var(--ink); border-radius: 999px; padding: .1rem .8rem; width: max-content; margin-top: .6rem; transform: rotate(2deg); }

    .stage { position: relative; }
    .track {
      display: flex; gap: clamp(1.25rem, 4vw, 3rem); overflow-x: auto; scroll-snap-type: x mandatory;
      padding: 2rem calc(50vw - min(43vw, 230px)) 3rem; scroll-behavior: smooth; scrollbar-width: none; align-items: flex-start;
    }
    .track::-webkit-scrollbar { display: none; }

    .card {
      --c: var(--pink);
      flex: 0 0 min(86vw, 460px); scroll-snap-align: center; position: relative;
      background: #fff; border: 5px solid var(--ink); border-radius: 36px 36px 28px 28px; padding: 0 0 1.5rem;
      box-shadow: 10px 12px 0 var(--ink); transform: rotate(var(--tilt, -2deg)) scale(.93); opacity: .85;
      transition: transform .45s cubic-bezier(.3, 1.6, .5, 1), opacity .3s;
    }
    .card:nth-child(1) { --tilt: -2.5deg; --c: var(--pink); }
    .card:nth-child(2) { --tilt: 2deg; --c: var(--sun); }
    .card:nth-child(3) { --tilt: -1.5deg; --c: #7be6ea; }
    .card.on { transform: rotate(0deg) scale(1); opacity: 1; }
    /* wrapper twist ends */
    .card::before, .card::after {
      content: ""; position: absolute; top: 120px; width: 46px; height: 70px; background: var(--c); border: 5px solid var(--ink);
    }
    .card::before { left: -34px; clip-path: polygon(100% 0, 0 12%, 38% 50%, 0 88%, 100% 100%); border: 0; }
    .card::after { right: -34px; clip-path: polygon(0 0, 100% 12%, 62% 50%, 100% 88%, 0 100%); border: 0; }
    .card .band {
      background: var(--c) repeating-linear-gradient(90deg, rgb(255 255 255 / .35) 0 14px, transparent 14px 28px);
      border-bottom: 5px solid var(--ink); border-radius: 30px 30px 0 0; padding: 1rem 1.25rem 0; position: relative; overflow: hidden;
    }
    .num { position: absolute; top: .6rem; right: .9rem; font-family: var(--display); background: var(--ink); color: var(--sun); border-radius: 999px; padding: .1rem .8rem; font-size: .95rem; transform: rotate(4deg); }
    .card svg.char { display: block; width: min(78%, 280px); margin: 0 auto; filter: drop-shadow(0 6px 0 rgb(58 29 92 / .25)); }
    .card.on svg.char { animation: bobchar 2.4s ease-in-out infinite; }
    .body { padding: 1.1rem 1.4rem 0; }
    .card h2 { font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 8vw, 2.7rem); line-height: 1; margin: 0 0 .4rem; color: var(--pink); text-shadow: 2px 2px 0 var(--ink); -webkit-text-stroke: 1px var(--ink); }
    .tag { margin: 0 0 .9rem; font-weight: 700; }
    .meta { list-style: none; display: flex; flex-wrap: wrap; gap: .4rem; padding: 0; margin: 0 0 1rem; }
    .meta li { background: var(--ink); color: #fff; border-radius: 10px 3px 10px 3px; font-size: .82rem; font-weight: 700; padding: .2rem .65rem; }
    .meta b { color: var(--sun); }
    .body h3 { font-family: var(--display); font-weight: 400; font-size: 1.35rem; margin: 1.1rem 0 .55rem; display: flex; align-items: center; gap: .5rem; }
    .body h3::after { content: ""; flex: 1; height: 8px; background: repeating-linear-gradient(90deg, var(--pink) 0 8px, transparent 8px 16px); border-radius: 4px; }
    .chips { list-style: none; display: flex; flex-wrap: wrap; gap: .5rem; padding: 0; margin: 0; }
    .chips li {
      position: relative; padding: .3rem .9rem; border: 3px solid var(--ink); border-radius: 999px; font-size: .92rem; font-weight: 700;
      background: var(--sun); transition: transform .2s;
    }
    .chips li:nth-child(3n+2) { background: #9ff0f2; }
    .chips li:nth-child(3n+3) { background: #ffb3d3; }
    .chips li:nth-child(odd) { transform: rotate(-1.5deg); }
    .chips li:nth-child(even) { transform: rotate(1.5deg); }
    .chips li:hover { transform: rotate(0) scale(1.08); }
    ol.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; }
    ol.steps li { counter-increment: s; position: relative; padding: 0 0 0 3.2rem; margin-bottom: .9rem; min-height: 2.5rem; }
    ol.steps li::before {
      content: counter(s); position: absolute; left: 0; top: -.15rem; width: 2.5rem; height: 2.5rem; display: grid; place-items: center;
      font-family: var(--display); font-size: 1.35rem; color: #fff; background: var(--pink); border: 3px solid var(--ink); border-radius: 50%;
      box-shadow: 2px 3px 0 var(--ink);
    }
    ol.steps li:nth-child(even)::before { background: var(--turq); border-radius: 12px; }
    .card.on ol.steps li::before { animation: hop 1.6s ease-in-out infinite; animation-delay: calc(var(--i) * .18s); }

    .controls { display: flex; align-items: center; justify-content: center; gap: 1rem; padding: 0 1rem 3rem; flex-wrap: wrap; }
    .arrow {
      width: 3.4rem; height: 3.4rem; border-radius: 50%; border: 4px solid var(--ink); background: var(--sun); color: var(--ink);
      font-family: var(--display); font-size: 1.6rem; cursor: pointer; box-shadow: 4px 4px 0 var(--ink); transition: transform .15s;
    }
    .arrow:hover:not(:disabled) { transform: scale(1.12) rotate(-6deg); }
    .arrow:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
    .arrow:disabled { opacity: .45; cursor: not-allowed; }
    .dots { display: flex; gap: .7rem; }
    .dot { width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 3px solid var(--ink); background: #fff; cursor: pointer; padding: 0; transition: transform .2s, background .2s; }
    .dot[aria-current="true"] { background: var(--pink); transform: scale(1.35); }
    .hint { text-align: center; font-weight: 700; margin: 0 0 .5rem; color: #fff; text-shadow: 2px 2px 0 var(--ink); font-size: 1.1rem; }

    #burst { position: fixed; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
    #burst i { position: absolute; width: 8px; height: 22px; border-radius: 6px; border: 2px solid var(--ink); }

    @keyframes bobchar { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
    @keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
    @media (max-width: 480px) { .card::before, .card::after { display: none; } .track { padding-left: 7vw; padding-right: 7vw; } }
  </style>
</head>
<body>
  <header class="top">
    <a class="back" href="../../index.html">&larr; Back to the candy jar</a>
    <h1 class="brand">Sprinkle Sundae<small>three bakes, wrapped to go!</small></h1>
  </header>

  <main class="stage">
    <p class="hint">Swipe sideways to unwrap the next treat</p>
    <div class="track" id="track" role="region" aria-label="Recipe carousel" tabindex="0"></div>
    <div class="controls">
      <button class="arrow" id="prev" aria-label="Previous recipe">&larr;</button>
      <div class="dots" id="dots" role="group" aria-label="Choose recipe"></div>
      <button class="arrow" id="next" aria-label="Next recipe">&rarr;</button>
    </div>
  </main>
  <div id="burst" aria-hidden="true"></div>

  <script src="../../recipes.js"></script>
  <script>
    (function () {
      var INK = "#3a1d5c", PINK = "#ff4f9a", SUN = "#ffd23f", TURQ = "#19c3c9";
      var SW = 'stroke="' + INK + '" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"';

      var art = {
        sourdough: function () { // sleepy boule with scoring and a rosy blush
          return '<svg class="char" viewBox="0 0 260 200" role="img" aria-label="A sleepy round loaf of bread with a tiny smile">' +
            '<ellipse cx="130" cy="186" rx="86" ry="9" fill="' + INK + '" opacity=".2"/>' +
            '<path d="M24 120C24 54 70 22 130 22s106 32 106 98c0 36-34 58-106 58S24 156 24 120z" fill="#e9a24d" ' + SW + '/>' +
            '<path d="M60 52c20-14 46-20 70-20" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="7" stroke-linecap="round"/>' +
            '<path d="M92 40l20 34M130 34l4 34M168 40l-16 34" fill="none" stroke="#fff3c9" stroke-width="7" stroke-linecap="round"/>' +
            '<path d="M86 108q12 10 24 0M150 108q12 10 24 0" fill="none" stroke="' + INK + '" stroke-width="5" stroke-linecap="round"/>' +
            '<ellipse cx="74" cy="128" rx="14" ry="9" fill="' + PINK + '" opacity=".7"/><ellipse cx="186" cy="128" rx="14" ry="9" fill="' + PINK + '" opacity=".7"/>' +
            '<path d="M118 130q12 14 24 0" fill="#fff" ' + SW + '/>' +
            '<text x="196" y="52" font-family="Bagel Fat One, sans-serif" font-size="28" fill="' + INK + '">z</text><text x="214" y="34" font-family="Bagel Fat One, sans-serif" font-size="20" fill="' + INK + '">z</text></svg>';
        },
        focaccia: function () { // slice wedge with dimples, wide-eyed, rosemary hair
          return '<svg class="char" viewBox="0 0 260 200" role="img" aria-label="A slice of focaccia with dimples and a surprised face">' +
            '<ellipse cx="130" cy="188" rx="90" ry="8" fill="' + INK + '" opacity=".2"/>' +
            '<path d="M130 176L28 70C70 26 190 26 232 70z" fill="#f2c25b" ' + SW + '/>' +
            '<path d="M130 176L28 70" fill="none" stroke="#c98a2b" stroke-width="5" stroke-linecap="round"/>' +
            '<g fill="#d99a2e" opacity=".8"><circle cx="70" cy="68" r="6"/><circle cx="130" cy="50" r="6"/><circle cx="190" cy="68" r="6"/><circle cx="104" cy="148" r="5"/><circle cx="158" cy="148" r="5"/></g>' +
            '<g ' + SW + ' fill="#fff"><circle cx="102" cy="92" r="17"/><circle cx="158" cy="92" r="17"/></g>' +
            '<circle cx="106" cy="94" r="7" fill="' + INK + '"/><circle cx="154" cy="94" r="7" fill="' + INK + '"/>' +
            '<ellipse cx="130" cy="130" rx="11" ry="14" fill="' + INK + '"/><ellipse cx="130" cy="136" rx="6" ry="6" fill="' + PINK + '"/>' +
            '<g fill="none" stroke="#2f8f3a" stroke-width="5" stroke-linecap="round"><path d="M130 36l-6-24M130 36l8-26M130 36l-20-18M130 36l22-16"/></g>' +
            '<g fill="#fff" stroke="' + INK + '" stroke-width="2"><rect x="62" y="84" width="7" height="5" rx="2"/><rect x="196" y="88" width="7" height="5" rx="2"/></g></svg>';
        },
        "chocolate-chip-cookies": function () { // cheeky cookie, one wink, tongue out
          return '<svg class="char" viewBox="0 0 260 200" role="img" aria-label="A grinning chocolate chip cookie winking and sticking out its tongue">' +
            '<ellipse cx="130" cy="188" rx="80" ry="8" fill="' + INK + '" opacity=".2"/>' +
            '<path d="M130 14l22 10 24-4 10 22 22 10-4 24 12 20-14 20 2 24-24 6-14 18-24-8-20 12-20-12-24 8-14-18-24-6 2-24-14-20 12-20-4-24 22-10 10-22 24 4z" transform="translate(0 -4) scale(.9) translate(14 12)" fill="#d99a52" ' + SW + '/>' +
            '<g fill="#5a2e22" stroke="' + INK + '" stroke-width="3"><path d="M64 46l16 4-4 14-14-4z"/><path d="M178 40l15 6-6 13-14-6z"/><path d="M200 112l14 2-1 14-14-2z"/><path d="M52 118l14 4-6 13-13-6z"/><path d="M120 28l14 2-2 12-13-2z"/><path d="M140 160l14 3-4 12-12-4z"/><path d="M84 160l12 2-2 12-12-2z"/></g>' +
            '<path d="M82 84q14-14 28 0" fill="none" stroke="' + INK + '" stroke-width="6" stroke-linecap="round"/>' +
            '<circle cx="164" cy="86" r="14" fill="#fff" ' + SW + '/><circle cx="167" cy="88" r="6" fill="' + INK + '"/>' +
            '<path d="M84 112q46 40 92 0z" fill="' + INK + '" ' + SW + '/><path d="M122 130q10 32 28 8 0-10-6-14z" fill="' + PINK + '" ' + SW + '/>' +
            '<circle cx="62" cy="104" r="9" fill="' + PINK + '" opacity=".55"/><circle cx="198" cy="100" r="9" fill="' + PINK + '" opacity=".55"/></svg>';
        }
      };

      function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

      var track = document.getElementById("track"), dotsEl = document.getElementById("dots");
      var prev = document.getElementById("prev"), next = document.getElementById("next");
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      track.innerHTML = RECIPES.map(function (r, i) {
        var draw = (art[r.slug] || art.sourdough)();
        return '<article class="card" id="card-' + i + '" aria-label="' + esc(r.name) + '">' +
          '<div class="band"><span class="num">No. ' + (i + 1) + ' of ' + RECIPES.length + '</span>' + draw + '</div>' +
          '<div class="body"><h2>' + esc(r.name) + '</h2><p class="tag">' + esc(r.tagline) + '</p>' +
          '<ul class="meta"><li><b>Time</b> ' + esc(r.time) + '</li><li><b>Makes</b> ' + esc(r.yield) + '</li><li><b>Level</b> ' + esc(r.difficulty) + '</li></ul>' +
          '<h3>Candy chips</h3><ul class="chips">' + r.ingredients.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + '</ul>' +
          '<h3>Hop to it</h3><ol class="steps">' + r.steps.map(function (x, j) { return '<li style="--i:' + j + '">' + esc(x) + "</li>"; }).join("") + '</ol></div></article>';
      }).join("");

      dotsEl.innerHTML = RECIPES.map(function (r, i) {
        return '<button class="dot" type="button" aria-label="Show ' + esc(r.name) + '" data-i="' + i + '"></button>';
      }).join("");

      var cards = Array.prototype.slice.call(track.children);
      var dots = Array.prototype.slice.call(dotsEl.children);
      var current = -1;

      function burst() {
        if (reduce || !Element.prototype.animate) return;
        var layer = document.getElementById("burst"), colors = [PINK, SUN, TURQ, "#fff", "#b07cff"];
        var cx = innerWidth / 2, cy = innerHeight * 0.45;
        for (var k = 0; k < 28; k++) {
          var s = document.createElement("i");
          s.style.left = cx + "px"; s.style.top = cy + "px"; s.style.background = colors[k % colors.length];
          layer.appendChild(s);
          var a = Math.random() * Math.PI * 2, d = 120 + Math.random() * Math.min(300, innerWidth / 2.2);
          var rot = (Math.random() * 720 - 360) + "deg";
          var anim = s.animate([
            { transform: "translate(0,0) rotate(0deg) scale(.4)", opacity: 1 },
            { transform: "translate(" + Math.cos(a) * d + "px," + (Math.sin(a) * d - 40) + "px) rotate(" + rot + ") scale(1)", opacity: 1, offset: .6 },
            { transform: "translate(" + Math.cos(a) * d * 1.1 + "px," + (Math.sin(a) * d + 120) + "px) rotate(" + rot + ") scale(1)", opacity: 0 }
          ], { duration: 900 + Math.random() * 400, easing: "cubic-bezier(.2,.7,.4,1)" });
          anim.onfinish = (function (el) { return function () { el.remove(); }; })(s);
        }
      }

      function setActive(i, fire) {
        if (i === current) return;
        var had = current !== -1;
        current = i;
        cards.forEach(function (c, n) { c.classList.toggle("on", n === i); });
        dots.forEach(function (d, n) { if (n === i) d.setAttribute("aria-current", "true"); else d.removeAttribute("aria-current"); });
        prev.disabled = i === 0; next.disabled = i === cards.length - 1;
        if (had && fire !== false) burst();
      }

      function nearest() {
        var mid = track.scrollLeft + track.clientWidth / 2, best = 0, bd = Infinity;
        cards.forEach(function (c, n) {
          var d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid);
          if (d < bd) { bd = d; best = n; }
        });
        return best;
      }

      function go(i) {
        i = Math.max(0, Math.min(cards.length - 1, i));
        var c = cards[i];
        track.scrollTo({ left: c.offsetLeft + c.offsetWidth / 2 - track.clientWidth / 2, behavior: reduce ? "auto" : "smooth" });
      }

      var ticking = false;
      track.addEventListener("scroll", function () {
        if (ticking) return; ticking = true;
        requestAnimationFrame(function () { ticking = false; setActive(nearest()); });
      }, { passive: true });
      prev.addEventListener("click", function () { go(current - 1); });
      next.addEventListener("click", function () { go(current + 1); });
      dotsEl.addEventListener("click", function (e) { var b = e.target.closest(".dot"); if (b) go(+b.dataset.i); });
      track.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight") { e.preventDefault(); go(current + 1); }
        if (e.key === "ArrowLeft") { e.preventDefault(); go(current - 1); }
      });

      setActive(0, false);
      track.scrollLeft = 0;
    })();
  </script>
</body>
</html>
