<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Winter Hearth — Bakes for the Cold Season</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pine: #0f3b2e; --cran: #b3202f; --cream: #fbf3e4; --gold: #d9a441; --frost: #cfe6f1;
      --display: "Fraunces", "Georgia", "Times New Roman", serif;
      --body: "Lato", "Segoe UI", Helvetica, Arial, sans-serif;
    }
    [data-theme="night"] { --bg: #0b2d23; --ink: #fbf3e4; --muted: #b9cfc5; --hero1: #061a14; --hero2: #0f3b2e; --toggle: #d9a441; --vine: #1d6a4f; }
    [data-theme="day"] { --bg: #fbf3e4; --ink: #0f3b2e; --muted: #4a6b5e; --hero1: #d3e9f3; --hero2: #fbf3e4; --toggle: #b3202f; --vine: #2c8a68; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.6; transition: background .6s, color .6s; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 6px; }

    /* HERO */
    .hero { position: relative; overflow: hidden; min-height: 78vh; background: linear-gradient(180deg, var(--hero1), var(--hero2)); display: flex; flex-direction: column; transition: background .6s; }
    #snow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .lights { position: relative; z-index: 2; height: 64px; margin: 0; padding: 0; list-style: none; display: flex; justify-content: space-between; border-top: 2px solid #0a0a0a33; }
    .lights li { width: 14px; height: 22px; border-radius: 50% 50% 55% 55%; position: relative; animation: twinkle 2.4s infinite ease-in-out; box-shadow: 0 0 14px 3px currentColor; background: currentColor; }
    .lights li::before { content: ""; position: absolute; left: 3px; top: -6px; width: 8px; height: 7px; background: #2a2a2a; border-radius: 2px; }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    .bar { position: relative; z-index: 3; display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .8rem clamp(1rem, 4vw, 2.5rem); flex-wrap: wrap; }
    .back { font-weight: 700; font-size: .85rem; text-decoration: none; padding: .45rem .9rem; border-radius: 999px; border: 2px dashed var(--gold); color: var(--ink); transition: background .3s; }
    .back:hover { background: rgba(217, 164, 65, .2); }
    .warm { display: inline-flex; align-items: center; gap: .6rem; cursor: pointer; font: 700 .85rem var(--body); color: var(--ink); background: transparent; border: 0; padding: .3rem; }
    .warm .track { width: 3.2rem; height: 1.7rem; border-radius: 999px; background: repeating-linear-gradient(45deg, var(--cran) 0 8px, var(--cream) 8px 16px); position: relative; border: 2px solid var(--gold); }
    .warm .knob { position: absolute; top: 1px; left: 2px; width: 1.25rem; height: 1.25rem; border-radius: 50%; background: var(--toggle); box-shadow: 0 0 10px var(--gold); transition: transform .4s; }
    .warm[aria-checked="true"] .knob { transform: translateX(1.5rem); }
    .hero-body { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 2rem clamp(1.25rem, 6vw, 5rem) 5rem; max-width: 60rem; }
    .eyebrow { font-weight: 700; letter-spacing: .2em; text-transform: uppercase; font-size: .78rem; color: var(--gold); margin: 0 0 .8rem; }
    [data-theme="day"] .eyebrow { color: var(--cran); }
    h1 { font-family: var(--display); font-weight: 600; font-size: clamp(3rem, 12vw, 8rem); line-height: .95; margin: 0 0 1.2rem; letter-spacing: -.02em; }
    h1 em { font-weight: 400; color: var(--frost); }
    [data-theme="day"] h1 em { color: var(--cran); }
    .hero-body p.lede { font-family: var(--display); font-style: italic; font-size: clamp(1.15rem, 3vw, 1.6rem); max-width: 34rem; margin: 0; color: var(--muted); }

    /* GARLAND */
    main { position: relative; max-width: 72rem; margin: 0 auto; padding: 3rem clamp(1rem, 4vw, 2.5rem) 5rem; }
    .garland { list-style: none; margin: 0; padding: 0; position: relative; }
    .garland::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 18px; margin-left: -9px; border-radius: 9px;
      background: radial-gradient(circle at 50% 50%, var(--cran) 0 3px, transparent 4px) 0 0 / 18px 46px, repeating-linear-gradient(180deg, var(--vine) 0 9px, #134a37 9px 18px); opacity: .95; }
    .node { position: relative; display: grid; grid-template-columns: 1fr 13rem 1fr; align-items: start; padding: 2.5rem 0; }
    .ornament { grid-column: 2; grid-row: 1; justify-self: center; position: relative; width: 12rem; height: 12rem; margin-top: 1.6rem; border-radius: 50%; border: 0; cursor: pointer; color: var(--cream);
      font-family: var(--display); font-weight: 600; font-size: 1.25rem; line-height: 1.15; padding: 1.4rem; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: .3rem;
      box-shadow: inset -14px -18px 30px rgba(0, 0, 0, .35), inset 10px 10px 24px rgba(255, 255, 255, .22), 0 14px 30px rgba(0, 0, 0, .35);
      transition: transform .5s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 50% -2rem; animation: sway 6s ease-in-out infinite; }
    .node:nth-child(2n) .ornament { animation-delay: -2s; }
    .node:nth-child(3n) .ornament { animation-delay: -4s; }
    @keyframes sway { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
    .ornament:hover { animation-play-state: paused; transform: scale(1.05); }
    .ornament::before { content: ""; position: absolute; top: -1.35rem; left: 50%; width: 2rem; height: 1.5rem; margin-left: -1rem; border-radius: 4px 4px 2px 2px; background: linear-gradient(90deg, #a67a22, var(--gold), #a67a22); }
    .ornament::after { content: ""; position: absolute; top: -3.2rem; left: 50%; width: 2px; height: 2rem; background: var(--gold); }
    .ornament .n { font-family: var(--body); font-size: .68rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; opacity: .85; }
    .ornament .hint { font-family: var(--body); font-weight: 400; font-size: .72rem; opacity: .85; }
    .ornament .stripe { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; background: linear-gradient(transparent 44%, rgba(251, 243, 228, .35) 44% 47%, transparent 47% 53%, rgba(251, 243, 228, .35) 53% 56%, transparent 56%); }
    .o0 { background: radial-gradient(circle at 32% 28%, #e0475a, var(--cran) 55%, #7a1520); }
    .o1 { background: radial-gradient(circle at 32% 28%, #f3cf84, var(--gold) 55%, #94691a); color: #3b2a05; }
    .o2 { background: radial-gradient(circle at 32% 28%, #7fa9be, #4d7e96 55%, #2b5166); }
    .ornament[aria-expanded="true"] { box-shadow: inset -14px -18px 30px rgba(0, 0, 0, .35), inset 10px 10px 24px rgba(255, 255, 255, .22), 0 0 0 5px var(--bg), 0 0 0 8px var(--gold), 0 0 40px rgba(217, 164, 65, .55); }

    .tag { grid-row: 1; grid-column: 3; position: relative; margin: 0 0 0 1.5rem; padding: 2rem clamp(1.2rem, 3vw, 2.2rem) 2rem; color: var(--pine); background: var(--cream);
      border-radius: 6px 26px 26px 26px; box-shadow: 0 12px 30px rgba(0, 0, 0, .3); transform: rotate(1.2deg); animation: drop .7s cubic-bezier(.3, 1.4, .5, 1) both; transform-origin: 0 0;
      background-image: repeating-linear-gradient(transparent 0 31px, rgba(15, 59, 46, .05) 31px 32px); }
    .tag[hidden] { display: none; }
    .node:nth-child(even) .tag { grid-column: 1; margin: 0 1.5rem 0 0; transform: rotate(-1.2deg); border-radius: 26px 6px 26px 26px; transform-origin: 100% 0; }
    @keyframes drop { from { opacity: 0; transform: rotate(-9deg) translateY(-16px); } }
    .tag::before { content: ""; position: absolute; top: .8rem; left: 1rem; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 3px var(--gold); }
    .tag .occasion { margin: 0 0 .5rem 1.8rem; font-weight: 700; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--cran); }
    .tag h2 { font-family: var(--display); font-weight: 600; font-size: clamp(1.6rem, 3.4vw, 2.3rem); line-height: 1.1; margin: 0 0 .4rem; }
    .tag .tagline { font-family: var(--display); font-style: italic; font-size: 1.1rem; margin: 0 0 1rem; }
    .tag .occ-line { background: rgba(207, 230, 241, .55); border-left: 4px solid var(--cran); padding: .6rem .9rem; margin: 0 0 1.2rem; border-radius: 0 10px 10px 0; font-size: .95rem; }
    .meta { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1.4rem; padding: 0; list-style: none; }
    .meta li { font-size: .8rem; font-weight: 700; padding: .25rem .7rem; border-radius: 999px; background: var(--pine); color: var(--cream); }
    .meta li span { color: var(--gold); font-weight: 400; margin-right: .3rem; }
    .tag h3 { font-family: var(--display); font-style: italic; font-weight: 600; font-size: 1.25rem; margin: 0 0 .5rem; }
    .list { list-style: none; margin: 0 0 1.4rem; padding: 0; font-family: var(--display); font-style: italic; font-size: 1.05rem; }
    .list li { position: relative; padding: .3rem 0 .3rem 1.9rem; border-bottom: 1.5px dashed rgba(15, 59, 46, .3); transform: rotate(-.4deg); }
    .list li:nth-child(even) { transform: rotate(.5deg); }
    .list li::before { content: ""; position: absolute; left: 0; top: .55rem; width: .75rem; height: 1.15rem; border-radius: 6px; background: repeating-linear-gradient(135deg, var(--cran) 0 4px, #fff 4px 8px); box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
    .steps { list-style: none; counter-reset: s; margin: 0; padding: 0; }
    .steps li { counter-increment: s; position: relative; padding: .45rem 0 .45rem 2.8rem; }
    .steps li::before { content: counter(s); position: absolute; left: 0; top: .3rem; width: 2rem; height: 2rem; border-radius: 50%; background: var(--pine); color: var(--gold); font-family: var(--display); font-weight: 600; display: grid; place-items: center; }

    footer { text-align: center; padding: 3rem 1rem 4rem; font-family: var(--display); font-style: italic; color: var(--muted); }
    footer b { color: var(--gold); font-style: normal; }

    @media (max-width: 800px) {
      .garland::before { left: 1.4rem; margin-left: 0; }
      .node, .node:nth-child(even) { grid-template-columns: 1fr; padding: 2rem 0 1.5rem; }
      .ornament { grid-column: 1; justify-self: start; margin-left: 0; width: 10.5rem; height: 10.5rem; font-size: 1.1rem; margin-left: 2.6rem; }
      .tag, .node:nth-child(even) .tag { grid-column: 1; grid-row: 2; margin: 1.5rem 0 0 2.4rem; transform: none; border-radius: 6px 22px 22px 22px; }
      .lights li { width: 10px; height: 16px; }
      .lights li:nth-child(even) { display: none; }
    }
    @media (max-width: 420px) { .tag { padding-inline: 1rem; } .ornament { margin-left: 2.2rem; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .lights li { opacity: 1; }
    }
  </style>
</head>
<body>
  <header class="hero" id="hero">
    <canvas id="snow" aria-hidden="true"></canvas>
    <ul class="lights" id="lights" aria-hidden="true"></ul>
    <div class="bar">
      <a class="back" href="../../index.html">&larr; Back to the gallery</a>
      <button class="warm" id="warm" role="switch" aria-checked="false" type="button">
        <span>Warm up</span><span class="track"><span class="knob"></span></span><span id="mode" aria-live="polite">Night</span>
      </button>
    </div>
    <div class="hero-body">
      <p class="eyebrow">Bakes for the cold season</p>
      <h1>Winter <em>Hearth</em></h1>
      <p class="lede">Hang a light, light the oven, and let the house smell like the holidays. Three bakes, three occasions.</p>
    </div>
  </header>

  <main>
    <ol class="garland" id="garland" aria-label="Recipes"></ol>
  </main>
  <footer><b>&#10052;</b> Warm hands, full table, happy holidays. <b>&#10052;</b></footer>

  <script src="../../recipes.js"></script>
  <script>
    (function () {
      var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      var OCC = {
        sourdough: ["Christmas dinner bread", "Start it on the 23rd. By the 25th you have a crackling loaf to tear at the table, with cold butter and the good jam."],
        focaccia: ["Boxing Day focaccia", "Cut it into squares for leftover-turkey sandwiches, with a smear of cranberry sauce and whatever cheese is hiding in the fridge."],
        "chocolate-chip-cookies": ["Cookies for Santa", "Plate a few, pour a glass of milk, and leave one carrot for the reindeer. Santa will understand the molten middles."]
      };
      function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

      /* string of lights */
      var lights = document.getElementById("lights");
      var cols = ["#b3202f", "#d9a441", "#cfe6f1", "#4fbf8a"];
      for (var i = 0; i < 28; i++) {
        var li = document.createElement("li");
        li.style.color = cols[i % cols.length];
        li.style.animationDelay = (-(i * 0.37) % 2.4).toFixed(2) + "s";
        li.style.marginTop = (Math.sin(i / 27 * Math.PI * 4) * 8 + 10).toFixed(1) + "px";
        lights.append(li);
      }

      /* recipes */
      var garland = document.getElementById("garland");
      var buttons = [];
      RECIPES.forEach(function (r, i) {
        var o = OCC[r.slug] || ["Winter table", "A warm bake for a cold evening."];
        var li = el("li", "node");
        var tagId = "tag-" + r.slug;

        var b = el("button", "ornament o" + (i % 3));
        b.type = "button";
        b.setAttribute("aria-expanded", "false");
        b.setAttribute("aria-controls", tagId);
        b.append(el("span", "stripe"));
        b.append(el("span", "n", "No. " + (i + 1)));
        b.append(el("span", "", r.name));
        b.append(el("span", "hint", o[0]));
        li.append(b);

        var tag = el("article", "tag");
        tag.id = tagId;
        tag.hidden = true;
        tag.setAttribute("aria-labelledby", tagId + "-h");
        tag.append(el("p", "occasion", o[0]));
        var h = el("h2", "", r.name); h.id = tagId + "-h"; tag.append(h);
        tag.append(el("p", "tagline", r.tagline));
        tag.append(el("p", "occ-line", o[1]));

        var meta = el("ul", "meta");
        [["Time", r.time], ["Makes", r.yield], ["Level", r.difficulty]].forEach(function (m) {
          var mi = el("li"); mi.append(el("span", "", m[0])); mi.append(document.createTextNode(m[1])); meta.append(mi);
        });
        tag.append(meta);

        tag.append(el("h3", "", "Shopping list"));
        var ul = el("ul", "list");
        r.ingredients.forEach(function (t) { ul.append(el("li", "", t)); });
        tag.append(ul);

        tag.append(el("h3", "", "How it goes"));
        var ol = el("ol", "steps");
        r.steps.forEach(function (t) { ol.append(el("li", "", t)); });
        tag.append(ol);
        li.append(tag);

        b.addEventListener("click", function () {
          var open = b.getAttribute("aria-expanded") === "true";
          b.setAttribute("aria-expanded", String(!open));
          tag.hidden = open;
          if (!open && window.innerWidth <= 800) tag.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
        });
        buttons.push(b);
        garland.append(li);
      });
      if (buttons[0]) buttons[0].click();

      /* day / night */
      var warm = document.getElementById("warm"), mode = document.getElementById("mode");
      var snowColor = "255,255,255";
      warm.addEventListener("click", function () {
        var day = warm.getAttribute("aria-checked") !== "true";
        warm.setAttribute("aria-checked", String(day));
        document.documentElement.setAttribute("data-theme", day ? "day" : "night");
        mode.textContent = day ? "Day" : "Night";
        snowColor = day ? "110,160,190" : "255,255,255";
        if (reduce) drawStatic();
      });

      /* snow */
      var cv = document.getElementById("snow"), hero = document.getElementById("hero"), ctx = cv.getContext("2d");
      var flakes = [], W = 0, H = 0, t = 0, raf = 0;
      function reset() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = hero.clientWidth; H = hero.clientHeight;
        cv.width = W * dpr; cv.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var n = W < 600 ? 55 : 130;
        flakes = [];
        for (var i = 0; i < n; i++) flakes.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2.6 + .8, v: Math.random() * .8 + .4, p: Math.random() * 6.28 });
      }
      function draw() {
        ctx.clearRect(0, 0, W, H);
        for (var i = 0; i < flakes.length; i++) {
          var f = flakes[i];
          ctx.beginPath();
          ctx.fillStyle = "rgba(" + snowColor + "," + (0.35 + f.r / 5).toFixed(2) + ")";
          ctx.arc(f.x, f.y, f.r, 0, 6.283);
          ctx.fill();
        }
      }
      function drawStatic() { draw(); }
      function tick() {
        t += 0.01;
        for (var i = 0; i < flakes.length; i++) {
          var f = flakes[i];
          f.y += f.v;
          f.x += Math.sin(t + f.p) * 0.4;
          if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
          if (f.x > W + 4) f.x = -4; else if (f.x < -4) f.x = W + 4;
        }
        draw();
        raf = requestAnimationFrame(tick);
      }
      reset();
      if (reduce) drawStatic(); else tick();
      var rt;
      window.addEventListener("resize", function () {
        clearTimeout(rt);
        rt = setTimeout(function () { reset(); if (reduce) drawStatic(); }, 150);
      });
    })();
  </script>
</body>
</html>
