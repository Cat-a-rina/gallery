<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BAKE. — Three recipes, no decoration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #f1efe8; --black: #0d0d0d; --red: #ff3b1f; --display: "Archivo Black", "Arial Black", Impact, sans-serif; --mono: "Space Mono", "Courier New", monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--black); font-family: var(--mono); font-size: .95rem; line-height: 1.5; }
    a { color: inherit; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }

    .bar { display: flex; justify-content: space-between; padding: .6rem 1rem; border-bottom: 3px solid var(--black); font-weight: 700; text-transform: uppercase; font-size: .8rem; }
    .bar a { text-decoration: none; } .bar a:hover { background: var(--black); color: var(--paper); }

    .shell { display: grid; grid-template-columns: minmax(300px, 46%) minmax(0, 1fr); gap: clamp(1.5rem, 4vw, 3.5rem); padding: clamp(1.25rem, 3vw, 2.5rem) clamp(1rem, 3vw, 2.5rem) 4rem; align-items: start; }
    .left { position: sticky; top: 1rem; }

    /* ---- the venn ---- */
    .stage { position: relative; width: min(100%, 620px); aspect-ratio: 1; margin: 0 auto; }
    .circle {
      position: absolute; width: 60%; aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--black); padding: 0; cursor: pointer;
      background: var(--fill); z-index: var(--z); transform: translate(0, 0) scale(1);
      transition: transform .65s cubic-bezier(.3, .9, .3, 1), opacity .5s, filter .5s;
    }
    .circle::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--solid); opacity: 0; transition: opacity .5s; }
    .circle:hover { transform: scale(1.025); }
    .c0 { left: 4%; top: 4%; --z: 1; --ox: -12%; --oy: -12%; --fill: rgb(255 59 31 / .6); --solid: var(--red); }
    .c1 { left: 36%; top: 4%; --z: 2; --ox: 12%; --oy: -12%; --fill: rgb(13 13 13 / .32); --solid: var(--black); }
    .c2 { left: 20%; top: 34%; --z: 3; --ox: 0%; --oy: 14%; --fill: repeating-linear-gradient(45deg, rgb(13 13 13 / .6) 0 3px, transparent 3px 9px); --solid: repeating-linear-gradient(45deg, var(--black) 0 3px, var(--paper) 3px 9px); }
    .lab {
      position: absolute; z-index: 1; background: var(--paper); border: 3px solid var(--black); padding: .2rem .55rem .25rem; pointer-events: none;
      font-family: var(--display); text-transform: uppercase; line-height: .95; font-size: clamp(.7rem, 1.9vw, 1.1rem); text-align: left;
    }
    .lab b { display: block; font-weight: 400; color: var(--red); font-size: 2.1em; line-height: .85; letter-spacing: -.04em; }
    .c0 .lab { left: 12%; top: 24%; } .c1 .lab { right: 12%; top: 24%; } .c2 .lab { left: 50%; bottom: 12%; transform: translateX(-50%); }

    /* choosing one: it comes forward, the others fade and slide back */
    .circle.on { z-index: 5; transform: scale(1.07); }
    .circle.on::before { opacity: 1; }
    .has .circle:not(.on) { z-index: 0; opacity: .24; filter: grayscale(1); transform: translate(var(--ox), var(--oy)) scale(.88); }
    .has .circle:not(.on):hover { opacity: .5; }
    .has .circle.on .lab { background: var(--black); color: var(--paper); border-color: var(--paper); }

    .legend { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; margin: 1.25rem 0 0; padding: 0; list-style: none; }
    .legend button { border: 3px solid var(--black); background: var(--paper); padding: .25rem .75rem; font-weight: 700; text-transform: uppercase; font-size: .75rem; cursor: pointer; }
    .legend button:hover { background: var(--black); color: var(--paper); }
    .legend button[aria-pressed="true"] { background: var(--red); }
    .hint { text-align: center; margin: .9rem 0 0; font-size: .8rem; text-transform: uppercase; font-weight: 700; }

    /* ---- the recipe ---- */
    .panel { min-height: 60vh; border: 3px solid var(--black); background: var(--paper); }
    .empty { padding: clamp(1.25rem, 3vw, 2.5rem); display: flex; flex-direction: column; justify-content: space-between; min-height: 60vh; }
    .empty h1 { font-family: var(--display); font-weight: 400; font-size: clamp(5rem, 15vw, 13rem); line-height: .8; letter-spacing: -.04em; margin: 0; }
    .empty h1 b { color: var(--red); font-weight: 400; }
    .empty p { margin: 1rem 0 0; font-weight: 700; text-transform: uppercase; }
    .empty .big { font-family: var(--display); font-size: clamp(1.4rem, 3vw, 2.4rem); line-height: .95; font-weight: 400; }

    .head { padding: clamp(1rem, 2.5vw, 2rem); border-bottom: 3px solid var(--black); }
    .head h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(2.2rem, 5.2vw, 5.4rem); line-height: .9; margin: 0; letter-spacing: -.02em; overflow-wrap: break-word; }
    .head h2 .no { color: var(--red); margin-right: .2em; letter-spacing: -.04em; }
    .head p { margin: 1rem 0 0; max-width: 32rem; }
    .specs { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1rem; }
    .specs span { border: 2px solid currentColor; padding: .1rem .6rem; font-weight: 700; text-transform: uppercase; font-size: .75rem; }
    .body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .body > div { padding: clamp(1rem, 2.5vw, 2rem); }
    .body > div + div { border-left: 3px solid var(--black); }
    h3 { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: 1rem; margin: 0 0 .25rem; }
    table { border-collapse: collapse; width: 100%; margin-top: .75rem; }
    td { padding: .25rem 0; border-top: 1px solid currentColor; vertical-align: top; }
    td:first-child { width: 2.5rem; font-weight: 700; color: var(--red); }
    .reveal { animation: up .5s cubic-bezier(.2, .8, .3, 1) both; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    @media (max-width: 900px) {
      .shell { display: block; }
      .left { position: static; margin-bottom: 1.5rem; }
      .stage { width: min(100%, 480px); }
      .panel, .empty { min-height: 0; }
      .empty h1 { font-size: 22vw; }
    }
    @media (max-width: 560px) { .body { grid-template-columns: 1fr; } .body > div + div { border-left: 0; border-top: 3px solid var(--black); } }
    @media (prefers-reduced-motion: reduce) { .circle, .circle::before { transition: none; } .reveal { animation: none; } }
  </style>
</head>
<body>
  <div class="bar"><a href="../../index.html">&larr; Gallery</a><span>Vol. 03 / Recipes</span></div>

  <div class="shell">
    <div class="left">
      <div class="stage" id="stage" role="group" aria-label="Three recipes as overlapping circles"></div>
      <ul class="legend" id="legend"></ul>
      <p class="hint">Click a circle. It comes forward.</p>
    </div>

    <section class="panel" id="panel" aria-live="polite"></section>
  </div>

  <script src="../../recipes.js"></script>
  <script>
    (function () {
      var pad = function (n) { return String(n).padStart(2, "0"); };
      var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
      var stage = document.getElementById("stage"), legend = document.getElementById("legend"), panel = document.getElementById("panel");
      var current = -1, circles = [], legendBtns = [];

      RECIPES.forEach(function (r, i) {
        var c = document.createElement("button");
        c.type = "button";
        c.className = "circle c" + i;
        c.setAttribute("aria-pressed", "false");
        c.setAttribute("aria-label", r.name);
        c.innerHTML = '<span class="lab"><b>' + pad(i + 1) + '</b>' + esc(r.name) + '</span>';
        c.addEventListener("click", function () { select(current === i ? -1 : i); });
        stage.appendChild(c);
        circles.push(c);

        var li = document.createElement("li");
        var b = document.createElement("button");
        b.type = "button"; b.setAttribute("aria-pressed", "false");
        b.textContent = pad(i + 1) + " " + r.name.split(" ").slice(-1)[0];
        b.addEventListener("click", function () { select(current === i ? -1 : i); });
        li.appendChild(b); legend.appendChild(li); legendBtns.push(b);
      });

      function empty() {
        panel.innerHTML = '<div class="empty reveal"><h1>BAKE<b>.</b></h1><div><p class="big">Three recipes.<br>No decoration.</p><p>&larr; Pick a circle</p></div></div>';
      }
      function detail(i) {
        var r = RECIPES[i];
        panel.innerHTML =
          '<div class="reveal"><div class="head"><h2><span class="no">' + pad(i + 1) + '</span>' + esc(r.name) + '</h2>' +
          '<p>' + esc(r.tagline) + '</p>' +
          '<div class="specs"><span>' + esc(r.time) + '</span><span>' + esc(r.yield) + '</span><span>' + esc(r.difficulty) + '</span></div></div>' +
          '<div class="body"><div><h3>Ingredients</h3><table>' +
            r.ingredients.map(function (x, j) { return '<tr><td>' + pad(j + 1) + '</td><td>' + esc(x) + '</td></tr>'; }).join("") +
          '</table></div><div><h3>Method</h3><table>' +
            r.steps.map(function (x, j) { return '<tr><td>' + String.fromCharCode(65 + j) + '</td><td>' + esc(x) + '</td></tr>'; }).join("") +
          '</table></div></div></div>';
      }

      function select(i) {
        current = i;
        stage.classList.toggle("has", i >= 0);
        circles.forEach(function (c, k) { c.classList.toggle("on", k === i); c.setAttribute("aria-pressed", k === i); });
        legendBtns.forEach(function (b, k) { b.setAttribute("aria-pressed", k === i); });
        if (i >= 0) detail(i); else empty();
        history.replaceState(null, "", i >= 0 ? "#" + RECIPES[i].slug : location.pathname + location.search);
        if (i >= 0 && window.matchMedia("(max-width: 900px)").matches) {
          panel.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
        }
      }

      document.addEventListener("keydown", function (e) { if (e.key === "Escape" && current >= 0) select(-1); });

      var start = -1, h = location.hash.slice(1);
      RECIPES.forEach(function (r, i) { if (r.slug === h) start = i; });
      select(start);
    })();
  </script>
</body>
</html>
