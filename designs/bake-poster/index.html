<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BAKE. — Three recipes, no decoration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #f1efe8; --black: #0d0d0d; --red: #ff3b1f; --display: "Archivo Black", "Arial Black", Impact, sans-serif; --mono: "Space Mono", "Courier New", monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--black); font-family: var(--mono); font-size: .95rem; line-height: 1.5; }
    a { color: inherit; }

    .bar { display: flex; justify-content: space-between; padding: .6rem 1rem; border-bottom: 3px solid var(--black); font-weight: 700; text-transform: uppercase; font-size: .8rem; }
    .bar a { text-decoration: none; } .bar a:hover { background: var(--black); color: var(--paper); }

    .marquee { overflow: hidden; white-space: nowrap; background: var(--black); color: var(--paper); border-bottom: 3px solid var(--black); font-family: var(--display); text-transform: uppercase; font-size: 1.1rem; padding: .4rem 0; }
    .marquee span { display: inline-block; padding-left: 100%; animation: scroll 28s linear infinite; }
    @keyframes scroll { to { transform: translateX(-100%); } }

    .hero { display: grid; grid-template-columns: 1fr minmax(180px, 28%); border-bottom: 3px solid var(--black); }
    .hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(5rem, 24vw, 22rem); line-height: .8; letter-spacing: -.04em; margin: 0; padding: 1rem 1rem 0; }
    .hero h1 b { color: var(--red); font-weight: 400; }
    .hero aside { background: var(--red); border-left: 3px solid var(--black); padding: 1rem; display: flex; flex-direction: column; justify-content: space-between; font-weight: 700; text-transform: uppercase; }
    .hero aside big { font-family: var(--display); font-size: clamp(2rem, 6vw, 5rem); line-height: .9; }

    .row { display: grid; grid-template-columns: minmax(90px, 18%) 1fr 1fr; border-bottom: 3px solid var(--black); transition: background .15s, color .15s; }
    .row:hover { background: var(--black); color: var(--paper); }
    .row:hover .no { color: var(--red); }
    .row > * { padding: 1rem; }
    .no { font-family: var(--display); font-size: clamp(3.5rem, 12vw, 11rem); line-height: .8; border-right: 3px solid currentColor; letter-spacing: -.04em; }
    .name { border-right: 3px solid currentColor; display: flex; flex-direction: column; justify-content: space-between; gap: 2rem; }
    .name h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(2rem, 5.5vw, 5rem); line-height: .9; margin: 0; letter-spacing: -.02em; }
    .name p { margin: 0; max-width: 28rem; }
    table { border-collapse: collapse; width: 100%; margin-top: .75rem; }
    td { padding: .25rem 0; border-top: 1px solid currentColor; vertical-align: top; }
    td:first-child { width: 2.5rem; font-weight: 700; color: var(--red); }
    .specs { display: flex; flex-wrap: wrap; gap: .4rem; }
    .specs span { border: 2px solid currentColor; padding: .1rem .6rem; font-weight: 700; text-transform: uppercase; font-size: .75rem; }
    h3 { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: 1rem; margin: 0 0 .25rem; }
    .col2 > * + * { margin-top: 1.5rem; }

    footer { padding: 3rem 1rem 1rem; font-family: var(--display); text-transform: uppercase; font-size: clamp(1.5rem, 5vw, 4rem); line-height: .95; }
    footer small { display: block; font-family: var(--mono); font-size: .8rem; margin-top: 1rem; }

    @media (max-width: 800px) {
      .hero { grid-template-columns: 1fr; } .hero aside { border-left: 0; border-top: 3px solid var(--black); }
      .row { grid-template-columns: 1fr; }
      .no, .name { border-right: 0; border-bottom: 3px solid currentColor; }
    }
    @media (prefers-reduced-motion: reduce) { .marquee span { animation: none; padding-left: 0; } }
  </style>
</head>
<body>
  <div class="bar"><a href="../../index.html">&larr; Gallery</a><span>Vol. 03 / Recipes</span></div>
  <div class="marquee" aria-hidden="true"><span id="ticker"></span></div>

  <header class="hero">
    <h1>BAKE<b>.</b></h1>
    <aside><span>Three recipes.<br>No decoration.</span><big>03</big></aside>
  </header>

  <main id="rows"></main>

  <footer>Flour.<br>Water.<br>Heat.<small>End of document.</small></footer>

  <script src="../../recipes.js"></script>
  <script>
    const pad = (n) => String(n).padStart(2, "0");
    document.getElementById("ticker").textContent =
      RECIPES.map((r) => r.name + " — " + r.time.split(" (")[0]).join("  •  ") + "  •  ";
    const rows = document.getElementById("rows");
    RECIPES.forEach((r, i) => {
      const s = document.createElement("section");
      s.className = "row";
      s.innerHTML = `
        <div class="no">${pad(i + 1)}</div>
        <div class="name">
          <h2>${r.name}</h2>
          <div><p>${r.tagline}</p><div class="specs" style="margin-top:1rem"><span>${r.time}</span><span>${r.yield}</span><span>${r.difficulty}</span></div></div>
        </div>
        <div class="col2">
          <div><h3>Ingredients</h3><table>${r.ingredients.map((x, j) => `<tr><td>${pad(j + 1)}</td><td>${x}</td></tr>`).join("")}</table></div>
          <div><h3>Method</h3><table>${r.steps.map((x, j) => `<tr><td>${String.fromCharCode(65 + j)}</td><td>${x}</td></tr>`).join("")}</table></div>
        </div>`;
      rows.appendChild(s);
    });
  </script>
</body>
</html>
