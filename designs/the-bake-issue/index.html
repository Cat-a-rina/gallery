<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Bake Issue — Three recipes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bone: #f3efe8; --black: #111; --tomato: #e4492f;
      --serif: "Playfair Display", "Didot", "Bodoni 72", Georgia, "Times New Roman", serif;
      --sans: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bone); color: var(--black); font-family: var(--serif); font-size: 17px; line-height: 1.6; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--tomato); outline-offset: 3px; }
    .kicker { font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--tomato); }

    /* contents ribbon */
    .ribbon { position: sticky; top: 0; z-index: 10; background: var(--bone); border-bottom: 3px solid var(--black); box-shadow: 0 3px 0 var(--bone), 0 4px 0 var(--tomato); }
    .ribbon-in { max-width: 1280px; margin: 0 auto; padding: 0 28px; display: flex; align-items: center; gap: 28px; height: 42px; font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
    .ribbon a { text-decoration: none; white-space: nowrap; padding: 4px 0; border-bottom: 2px solid transparent; }
    .ribbon a:hover { border-color: var(--tomato); }
    .ribbon .back { margin-right: auto; font-weight: 500; }
    .ribbon .lab { color: var(--tomato); }
    .ribbon nav { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; }
    .ribbon nav::-webkit-scrollbar { display: none; }

    .wrap { max-width: 1280px; margin: 0 auto; padding: 0 28px; }

    /* cover */
    .cover { padding-top: 22px; }
    .masthead { font-weight: 900; font-size: 10.2vw; line-height: .9; letter-spacing: -.025em; margin: 0; text-align: center; text-transform: uppercase; }
    .issueline { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--black); border-bottom: 1px solid var(--black); margin: 14px 0 0; padding: 7px 0; font-family: var(--sans); font-size: 11px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; }
    .cover-body { display: grid; grid-template-columns: 1.55fr 1fr; gap: 0 40px; border-bottom: 6px solid var(--black); }
    .numeral { font-weight: 900; font-size: min(46vw, 640px); line-height: .78; letter-spacing: -.06em; margin: 0; padding: .1em 0 .02em; position: relative; }
    .numeral small { position: absolute; left: .06em; bottom: .08em; font-family: var(--serif); font-style: italic; font-weight: 400; font-size: clamp(18px, 3vw, 40px); letter-spacing: 0; line-height: 1.1; max-width: 8em; background: var(--bone); padding: 6px 12px 6px 0; }
    .lines { border-left: 1px solid var(--black); padding: 24px 0 24px 28px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; }
    .lines ol { list-style: none; margin: 0; padding: 0; }
    .lines li { border-top: 3px solid var(--tomato); padding: 10px 0 22px; }
    .lines li a { text-decoration: none; display: block; }
    .lines li a:hover h2 { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
    .lines h2 { font-weight: 700; font-size: clamp(26px, 3vw, 40px); line-height: 1.05; margin: 8px 0 8px; }
    .lines p { margin: 0; font-style: italic; font-size: 17px; }
    .lines .pg { font-family: var(--sans); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; }
    .barcode { height: 38px; width: 130px; background: repeating-linear-gradient(90deg, var(--black) 0 2px, transparent 2px 4px, var(--black) 4px 5px, transparent 5px 8px, var(--black) 8px 11px, transparent 11px 12px); }

    /* spreads */
    .spread { padding: 72px 0 0; }
    .sh { border-top: 6px solid var(--black); padding-top: 12px; }
    .sh .top { display: flex; justify-content: space-between; gap: 16px; }
    .sh h2 { font-weight: 900; font-size: clamp(46px, 11vw, 168px); line-height: .92; letter-spacing: -.03em; margin: 18px 0 14px; }
    .byline { display: flex; flex-wrap: wrap; gap: 6px 28px; border-top: 1px solid var(--black); border-bottom: 1px solid var(--black); padding: 8px 0; font-family: var(--sans); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 500; }
    .byline b { color: var(--tomato); font-weight: 600; margin-right: 6px; }

    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 0 32px; margin-top: 36px; }
    .lede { font-size: 19px; line-height: 1.65; margin: 0 0 26px; }
    .lede::first-letter { font-weight: 900; float: left; font-size: 5.6em; line-height: .8; padding: .06em .09em 0 0; }
    .need { border-top: 8px solid var(--black); background: transparent; padding: 12px 0 0; align-self: start; }
    .need h3, .method h3 { font-family: var(--sans); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; margin: 0 0 12px; }
    .need h3 span { color: var(--tomato); }
    .need ul { list-style: none; margin: 0; padding: 0; column-count: 2; column-gap: 24px; column-rule: 1px solid var(--black); font-size: 15px; line-height: 1.4; }
    .need li { break-inside: avoid; padding: 0 0 12px; }
    .pull { margin: 0; font-style: italic; font-weight: 700; font-size: clamp(30px, 4.4vw, 62px); line-height: 1.08; letter-spacing: -.01em; border-top: 3px solid var(--tomato); border-bottom: 3px solid var(--tomato); padding: 22px 0; }
    .pull::before { content: "\201C"; }
    .pull::after { content: "\201D"; }
    .method ol { list-style: none; counter-reset: s; margin: 0; padding: 0; column-count: 2; column-gap: 40px; column-rule: 1px solid var(--black); }
    .method li { counter-increment: s; break-inside: avoid; padding: 0 0 18px; }
    .method li::before { content: counter(s); display: block; font-weight: 900; font-size: 44px; line-height: 1; margin-bottom: 4px; }
    .folio { display: flex; justify-content: space-between; margin-top: 44px; padding: 8px 0 0; border-top: 1px solid var(--black); font-family: var(--sans); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; font-weight: 500; }
    .folio b { color: var(--tomato); font-weight: 600; }

    /* spread 1: sidebar left, story right */
    .s1 .need { grid-column: 1 / 5; grid-row: 1 / 3; }
    .s1 .need ul { column-count: 2; }
    .s1 .lede { grid-column: 5 / 13; }
    .s1 .pull { grid-column: 5 / 13; margin-bottom: 30px; }
    .s1 .method { grid-column: 5 / 13; }
    /* spread 2: story left, sidebar right, pull quote cuts across the top */
    .s2 .sh h2 { text-align: right; font-style: italic; font-weight: 700; }
    .s2 .pull { grid-column: 1 / 13; text-align: center; margin: 0 0 34px; font-size: clamp(34px, 6vw, 84px); }
    .s2 .lede { grid-column: 1 / 8; }
    .s2 .method { grid-column: 1 / 8; }
    .s2 .need { grid-column: 9 / 13; grid-row: 2 / 4; }
    .s2 .need ul { column-count: 1; }
    /* spread 3: reversed black page, ingredients run as a wide band */
    .s3 { background: var(--black); color: var(--bone); margin-top: 72px; padding: 56px 0 40px; }
    .s3 .sh { border-top-color: var(--bone); }
    .s3 .byline, .s3 .folio { border-color: var(--bone); }
    .s3 .need { border-top-color: var(--bone); grid-column: 1 / 13; }
    .s3 .need ul { column-count: 3; column-rule-color: var(--bone); }
    .s3 .lede { grid-column: 1 / 6; margin-top: 12px; }
    .s3 .pull { grid-column: 6 / 13; margin: 12px 0 30px; align-self: start; }
    .s3 .method { grid-column: 1 / 13; }
    .s3 .method ol { column-rule-color: var(--bone); }
    .s3 :focus-visible { outline-color: var(--tomato); }
    .s3 .need { order: 1; } .s3 .lede { order: 2; } .s3 .pull { order: 3; } .s3 .method { order: 4; }

    footer.colophon { padding: 40px 0 70px; font-family: var(--sans); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

    @media (max-width: 860px) {
      .cover-body { grid-template-columns: 1fr; }
      .lines { border-left: 0; border-top: 1px solid var(--black); padding: 20px 0; }
      .numeral { font-size: 62vw; }
      .grid { display: block; }
      .grid > * { margin-bottom: 26px; }
      .need ul, .s1 .need ul, .s2 .need ul, .s3 .need ul { column-count: 2; }
      .s2 .sh h2 { text-align: left; }
    }
    @media (max-width: 560px) {
      body { font-size: 16px; }
      .wrap, .ribbon-in { padding: 0 16px; }
      .masthead { font-size: 10.6vw; }
      .need ul, .s1 .need ul, .s2 .need ul, .s3 .need ul { column-count: 1; }
      .method ol { column-count: 1; }
      .ribbon .back span { display: none; }
      .ribbon .lab { display: none; }
      .lede { font-size: 17.5px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header class="ribbon">
    <div class="ribbon-in">
      <a class="back" href="../../index.html">&larr; <span>Gallery</span></a>
      <span class="lab">Contents</span>
      <nav aria-label="Contents" id="toc"></nav>
    </div>
  </header>

  <main>
    <section class="cover wrap" id="cover" aria-labelledby="mast">
      <h1 class="masthead" id="mast">The Bake Issue</h1>
      <div class="issueline"><span>No. 03</span><span>Autumn 2026</span><span>Flour &middot; Water &middot; Heat</span><span>Three recipes, no shortcuts</span></div>
      <div class="cover-body">
        <p class="numeral" aria-hidden="true">3<small>loaves, pans &amp; trays worth the wait</small></p>
        <div class="lines">
          <div class="kicker">In this issue</div>
          <ol id="lines"></ol>
          <div class="barcode" aria-hidden="true"></div>
        </div>
      </div>
    </section>
    <div id="spreads"></div>
  </main>
  <footer class="wrap colophon"><span>The Bake Issue</span><span>End of issue</span><a href="#cover">Back to cover &uarr;</a></footer>

  <script src="../../recipes.js"></script>
  <script>
    (function () {
      var esc = function (s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; };
      var pad = function (n) { return String(n).padStart(2, "0"); };
      var EXTRA = {
        "sourdough": { kick: "The Long Read", text: "Patience is the only rare ingredient here. A loaf like this is built over a day and a night, mostly by doing nothing at all, and the reward is a crust that sings as it cools." },
        "focaccia": { kick: "The Weeknight Showpiece", text: "Nearly all of the work happens while you sleep. Come morning there is a cold, bubbling dough, a glug of oil and a row of fingertips waiting to leave their mark." },
        "chocolate-chip-cookies": { kick: "The Crowd Pleaser", text: "Browning the butter is the whole argument. It turns an ordinary cookie into something nutty and deep, and an hour in the fridge lets the dough make it." }
      };
      var PAGES = [12, 26, 40];
      var toc = document.getElementById("toc"), lines = document.getElementById("lines"), box = document.getElementById("spreads");

      toc.innerHTML = '<a href="#cover">Cover</a>' + RECIPES.map(function (r, i) {
        return '<a href="#' + esc(r.slug) + '">' + pad(i + 1) + ' ' + esc(r.name) + '</a>';
      }).join("");

      RECIPES.forEach(function (r, i) {
        var ex = EXTRA[r.slug] || { kick: "Feature", text: "" };
        var pg = PAGES[i] || (12 + i * 14);

        var li = document.createElement("li");
        li.innerHTML = '<a href="#' + esc(r.slug) + '"><span class="pg">' + esc(ex.kick) + ' &middot; p. ' + pg + '</span><h2>' + esc(r.name) + '</h2><p>' + esc(r.tagline) + '</p></a>';
        lines.appendChild(li);

        var s = document.createElement("article");
        s.className = "spread s" + (i % 3 + 1); s.id = r.slug; s.setAttribute("aria-labelledby", "h-" + r.slug);
        var inner =
          '<div class="wrap">' +
            '<header class="sh"><div class="top kicker"><span>' + esc(ex.kick) + '</span><span>No. ' + pad(i + 1) + '</span></div>' +
            '<h2 id="h-' + esc(r.slug) + '">' + esc(r.name) + '</h2>' +
            '<div class="byline"><span><b>Time</b>' + esc(r.time) + '</span><span><b>Yield</b>' + esc(r.yield) + '</span><span><b>Level</b>' + esc(r.difficulty) + '</span></div></header>' +
            '<div class="grid">' +
              '<aside class="need" aria-label="Ingredients"><h3><span>&#9632;</span> You&rsquo;ll need</h3><ul>' +
                r.ingredients.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join("") +
              '</ul></aside>' +
              '<p class="lede">' + esc(r.tagline + " " + ex.text) + '</p>' +
              '<blockquote class="pull">' + esc(r.tagline.replace(/\.$/, "")) + '</blockquote>' +
              '<section class="method" aria-label="Method"><h3>The method</h3><ol>' +
                r.steps.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join("") +
              '</ol></section>' +
            '</div>' +
            '<div class="folio"><span><b>' + pg + '</b> &nbsp;The Bake Issue</span><span>' + esc(r.name) + ' &nbsp;<b>' + (pg + 1) + '</b></span></div>' +
          '</div>';
        s.innerHTML = inner;
        box.appendChild(s);
      });
    })();
  </script>
</body>
</html>
