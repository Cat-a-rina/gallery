<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saturday Stall — Kraft Market Bakes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    :root { --kraft: #c8a273; --ink: #2a2118; --red: #c0392b; --green: #4d7c3a; --cream: #f7efdc;
      --display: "Permanent Marker", "Marker Felt", "Segoe Print", cursive; --body: "Kalam", "Segoe Print", "Comic Sans MS", cursive; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: var(--body); font-size: 1.15rem; color: var(--ink);
      background-color: var(--kraft);
      background-image:
        radial-gradient(ellipse at 30% 10%, rgb(255 255 255 / .18), transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgb(60 30 0 / .2), transparent 55%),
        repeating-linear-gradient(87deg, rgb(90 55 20 / .05) 0 2px, transparent 2px 7px),
        repeating-linear-gradient(3deg, rgb(255 255 255 / .04) 0 1px, transparent 1px 5px);
      overflow-x: hidden;
    }
    a:focus-visible, button:focus-visible, input:focus-visible + .box { outline: 3px dashed var(--red); outline-offset: 3px; }

    .back { position: absolute; top: .7rem; left: .8rem; z-index: 5; font-family: var(--display); font-size: .95rem; color: var(--ink); text-decoration: none; background: var(--cream); padding: .25rem .8rem; border: 2px solid var(--ink); border-radius: 3px; transform: rotate(-2deg); box-shadow: 2px 2px 0 var(--ink); }
    .back:hover { background: #fff; }

    /* twine + tags */
    .twine-wrap { position: relative; padding-top: 3.2rem; }
    .twine { position: absolute; top: 3rem; left: -2%; width: 104%; height: 40px; pointer-events: none; }
    nav.tags { display: flex; justify-content: center; gap: clamp(.6rem, 4vw, 3rem); padding: 1.6rem .75rem 0; position: relative; }
    .tag {
      --r: 0deg; position: relative; font-family: var(--display); font-size: clamp(.85rem, 3.2vw, 1.15rem); line-height: 1.1; color: var(--ink);
      background: var(--cream); border: 2px solid var(--ink); border-radius: 4px;
      width: clamp(92px, 27vw, 190px); padding: 2.1rem .5rem .8rem; text-align: center; cursor: pointer;
      clip-path: polygon(0 22%, 18% 0, 82% 0, 100% 22%, 100% 100%, 0 100%);
      transform-origin: 50% -1.3rem; transform: rotate(var(--r)); transition: transform .35s ease, background .2s;
      animation: sway 5s ease-in-out infinite;
    }
    .tag:nth-child(1) { --r: -3deg; } .tag:nth-child(2) { --r: 2deg; animation-delay: -1.7s; } .tag:nth-child(3) { --r: -1.5deg; animation-delay: -3.1s; }
    .tag::before { content: ""; position: absolute; top: 1.05rem; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--kraft); border: 2px solid var(--ink); }
    .tag small { display: block; font-family: var(--body); font-weight: 700; font-size: .75em; color: var(--red); margin-top: .3rem; }
    .tag:hover { background: #fff; }
    .tag[aria-selected="true"] { background: var(--red); color: var(--cream); animation: none; transform: rotate(0) translateY(10px) scale(1.05); }
    .tag[aria-selected="true"] small { color: var(--cream); }
    /* clip-path swallows outlines on tags; use inset shadow instead */
    .tag:focus-visible { outline: none; box-shadow: inset 0 0 0 4px var(--green); }
    @keyframes sway { 0%,100% { transform: rotate(var(--r)); } 50% { transform: rotate(calc(var(--r) * -.6)); } }

    main { max-width: 1050px; margin: 2.5rem auto 0; padding: 0 clamp(.75rem, 3vw, 2rem); }
    .label {
      position: relative; background: var(--cream); padding: clamp(1.25rem, 4vw, 2.75rem); border-radius: 6px 14px 8px 12px;
      box-shadow: 0 3px 0 rgb(0 0 0 / .15), 0 14px 24px rgb(60 30 0 / .35); transform: rotate(-.6deg);
      background-image: repeating-linear-gradient(0deg, transparent 0 31px, rgb(77 124 58 / .12) 31px 32px);
    }
    .label::before, .label::after { content: ""; position: absolute; width: 90px; height: 26px; background: rgb(255 240 190 / .65); border: 1px solid rgb(0 0 0 / .08); top: -12px; }
    .label::before { left: 6%; transform: rotate(-8deg); } .label::after { right: 6%; transform: rotate(6deg); }
    .recipe[hidden] { display: none; }
    .recipe.enter { animation: slap .45s cubic-bezier(.2, 1.4, .4, 1); }
    @keyframes slap { from { opacity: 0; transform: scale(1.12) rotate(2deg); } to { opacity: 1; transform: none; } }

    .head { display: grid; grid-template-columns: 1fr auto; gap: 1rem 2rem; align-items: center; }
    .stamp-title { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(2.2rem, 8vw, 4.6rem); line-height: .95; color: var(--red); text-transform: uppercase;
      border: 5px double var(--red); padding: .35rem .8rem; display: inline-block; transform: rotate(-2.5deg); opacity: .88; mix-blend-mode: multiply;
      -webkit-mask-image: radial-gradient(circle at 12% 30%, transparent 0 2px, #000 3px), radial-gradient(circle at 70% 80%, transparent 0 2px, #000 3px);
      -webkit-mask-composite: source-in; mask-composite: intersect;
      text-shadow: 1px 0 0 rgb(192 57 43 / .5), -1px 1px 0 rgb(192 57 43 / .4); }
    .seal { width: clamp(110px, 20vw, 170px); height: auto; transform: rotate(10deg); mix-blend-mode: multiply; opacity: .9; }
    .tagline { font-size: 1.4rem; font-weight: 700; margin: 1rem 0 .5rem; }
    .facts { display: flex; flex-wrap: wrap; gap: .5rem .75rem; list-style: none; padding: 0; margin: 0 0 1.5rem; }
    .facts li { font-family: var(--display); font-size: .95rem; border: 2px solid var(--green); color: var(--green); padding: .1rem .7rem; border-radius: 40px; transform: rotate(var(--fr, -1deg)); }
    .facts li:nth-child(2) { --fr: 1.5deg; } .facts li:nth-child(3) { --fr: -2deg; }

    .cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 2rem; align-items: start; }
    h3 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; margin: 0 0 .6rem; color: var(--green); }
    .packing { border: 2px solid var(--ink); padding: 1rem 1.1rem 1.2rem; background: rgb(255 255 255 / .45); transform: rotate(.8deg); }
    .packing h3 { border-bottom: 2px dashed var(--ink); padding-bottom: .3rem; }
    .packing ul { list-style: none; margin: 0; padding: 0; }
    .packing label { display: flex; gap: .65rem; align-items: flex-start; padding: .25rem 0; cursor: pointer; line-height: 1.3; }
    .packing input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .box { flex: none; width: 1.5rem; height: 1.5rem; border: 2.5px solid var(--ink); border-radius: 3px 5px 3px 6px; margin-top: .05rem; position: relative; background: #fff; }
    .box::after { content: ""; position: absolute; left: .32rem; top: -.2rem; width: .5rem; height: 1.1rem; border: solid var(--red); border-width: 0 5px 5px 0; transform: rotate(40deg) scale(0); transition: transform .2s cubic-bezier(.3, 1.6, .5, 1); }
    input:checked + .box::after { transform: rotate(40deg) scale(1); }
    input:checked ~ .txt { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; opacity: .6; }
    .count { font-family: var(--display); font-size: .9rem; color: var(--red); margin: .8rem 0 0; }

    /* torn ticket */
    .ticket { position: relative; background: #fff7d6; padding: 1.1rem 1.4rem 1.4rem 2.2rem; border: 2px solid rgb(42 33 24 / .25);
      -webkit-mask: radial-gradient(circle 9px at 0 50%, transparent 98%, #000) left / 51% 22px repeat-y, radial-gradient(circle 9px at 100% 50%, transparent 98%, #000) right / 51% 22px repeat-y;
      mask: radial-gradient(circle 9px at 0 50%, transparent 98%, #000) left / 51% 22px repeat-y, radial-gradient(circle 9px at 100% 50%, transparent 98%, #000) right / 51% 22px repeat-y;
      border-image: none; box-shadow: 0 0 0 transparent; }
    .ticket::before { content: ""; position: absolute; left: 1.15rem; top: 3.6rem; bottom: 1rem; border-left: 3px dashed rgb(42 33 24 / .45); }
    .ticket ol { list-style: none; counter-reset: s; margin: 0; padding: 0; }
    .ticket li { counter-increment: s; position: relative; padding: .35rem 0 .35rem .9rem; line-height: 1.35; }
    .ticket li::before { content: "No." counter(s); position: absolute; left: -2.3rem; top: .35rem; font-family: var(--display); font-size: .6rem; color: var(--red); background: #fff7d6; width: 2rem; text-align: center; }
    .ticket li + li { border-top: 1px dotted rgb(42 33 24 / .35); }

    /* crate */
    .crate-wrap { display: flex; justify-content: center; margin: 3.5rem 0 0; padding: 0 1rem; }
    .crate { position: relative; width: min(480px, 100%); height: 130px; background: #9a6b3a; border: 4px solid #5b3a18; border-radius: 4px 4px 0 0;
      background-image: repeating-linear-gradient(0deg, transparent 0 40px, #5b3a18 40px 44px), repeating-linear-gradient(90deg, rgb(0 0 0 / .08) 0 3px, transparent 3px 11px);
      box-shadow: 0 10px 0 -2px rgb(0 0 0 / .25); display: grid; place-items: center; }
    .crate::before, .crate::after { content: ""; position: absolute; top: -4px; bottom: -4px; width: 18px; background: #7d5228; border: 4px solid #5b3a18; }
    .crate::before { left: 12px; } .crate::after { right: 12px; }
    .crate span { font-family: var(--display); color: var(--cream); background: var(--ink); padding: .2rem .9rem; transform: rotate(-3deg); font-size: 1.1rem; z-index: 2; border: 2px solid var(--cream); }
    .loaf { position: absolute; bottom: 100%; margin-bottom: -6px; }
    .l1 { left: 18%; width: 90px; height: 42px; background: #b87333; border-radius: 50% 50% 8px 8px; box-shadow: inset 0 -6px 0 rgb(0 0 0 / .15); }
    .l2 { left: 42%; width: 70px; height: 52px; background: var(--green); border-radius: 50% 50% 4px 4px / 80% 80% 4px 4px; }
    .l3 { right: 16%; width: 80px; height: 34px; background: #e0a84a; border-radius: 6px; box-shadow: inset 0 -6px 0 rgb(0 0 0 / .15); }
    .l2::after { content: ""; position: absolute; top: 10px; left: 50%; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: var(--red); box-shadow: -18px 14px 0 -4px var(--red), 18px 14px 0 -4px var(--red); }
    footer { text-align: center; font-family: var(--display); padding: 1.5rem 1rem 2.5rem; }

    @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } .head { grid-template-columns: 1fr; } .seal { justify-self: end; margin-top: -1rem; } .tag { padding-top: 1.9rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <a class="back" href="../../index.html">&larr; back to gallery</a>

  <div class="twine-wrap">
    <svg class="twine" viewBox="0 0 1000 40" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 8 Q250 36 500 14 T1000 10" fill="none" stroke="#e8d3a2" stroke-width="5"/>
      <path d="M0 8 Q250 36 500 14 T1000 10" fill="none" stroke="#7a5a2c" stroke-width="5" stroke-dasharray="3 5"/>
    </svg>
    <nav class="tags" id="tags" role="tablist" aria-label="Pick a bake"></nav>
  </div>

  <main>
    <div class="label" id="label"></div>
  </main>

  <div class="crate-wrap" aria-hidden="true">
    <div class="crate"><i class="loaf l1"></i><i class="loaf l2"></i><i class="loaf l3"></i><span>FRESH · LOCAL</span></div>
  </div>
  <footer>Come find us by the blue tent &mdash; cash &amp; smiles welcome.</footer>

  <script src="../../recipes.js"></script>
  <script>
    (function () {
      var tags = document.getElementById("tags");
      var label = document.getElementById("label");
      var tagEls = [], panels = [];
      var prices = ["$9", "$7", "$4"];

      var seal = '<svg class="seal" viewBox="0 0 200 200" role="img" aria-label="Small batch, hand made stamp">' +
        '<defs><path id="arcTop" d="M30 100 A70 70 0 0 1 170 100"/><path id="arcBot" d="M22 100 A78 78 0 0 0 178 100"/></defs>' +
        '<g fill="none" stroke="#4d7c3a" stroke-width="5"><circle cx="100" cy="100" r="92"/><circle cx="100" cy="100" r="58" stroke-width="3"/></g>' +
        '<g fill="#4d7c3a" font-family="Permanent Marker, Marker Felt, cursive" font-size="22" text-anchor="middle" letter-spacing="2">' +
        '<text><textPath href="#arcTop" startOffset="50%">SMALL BATCH</textPath></text>' +
        '<text><textPath href="#arcBot" startOffset="50%" dy="14">HAND MADE</textPath></text></g>' +
        '<g fill="#4d7c3a" text-anchor="middle" font-family="Permanent Marker, cursive"><text x="100" y="112" font-size="34">&#9733;</text></g></svg>';

      function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

      RECIPES.forEach(function (r, i) {
        var t = document.createElement("button");
        t.type = "button"; t.className = "tag"; t.id = "tab-" + i;
        t.setAttribute("role", "tab"); t.setAttribute("aria-controls", "panel-" + i);
        t.innerHTML = esc(r.name) + "<small>" + prices[i % prices.length] + " / " + esc(r.yield.split(",")[0]) + "</small>";
        t.addEventListener("click", function () { select(i, false); });
        t.addEventListener("keydown", function (e) {
          var n = null;
          if (e.key === "ArrowRight") n = (i + 1) % RECIPES.length;
          if (e.key === "ArrowLeft") n = (i + RECIPES.length - 1) % RECIPES.length;
          if (n !== null) { e.preventDefault(); select(n, true); }
        });
        tags.appendChild(t); tagEls.push(t);

        var p = document.createElement("article");
        p.className = "recipe"; p.id = "panel-" + i; p.hidden = true;
        p.setAttribute("role", "tabpanel"); p.setAttribute("aria-labelledby", "tab-" + i);
        p.innerHTML =
          '<div class="head"><h2 class="stamp-title">' + esc(r.name) + '</h2>' + seal + '</div>' +
          '<p class="tagline">' + esc(r.tagline) + '</p>' +
          '<ul class="facts"><li>Time: ' + esc(r.time) + '</li><li>Makes: ' + esc(r.yield) + '</li><li>Skill: ' + esc(r.difficulty) + '</li></ul>' +
          '<div class="cols"><section class="packing" aria-label="Ingredients"><h3>Packing list</h3><ul>' +
          r.ingredients.map(function (x, k) {
            return '<li><label><input type="checkbox" data-r="' + i + '"><span class="box"></span><span class="txt">' + esc(x) + '</span></label></li>';
          }).join("") +
          '</ul><p class="count" aria-live="polite"></p></section>' +
          '<section aria-label="Steps"><h3>Admit one: the method</h3><div class="ticket"><ol>' +
          r.steps.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") +
          '</ol></div></section></div>';
        label.appendChild(p); panels.push(p);

        var boxes = p.querySelectorAll("input"), count = p.querySelector(".count");
        function upd() {
          var n = 0; boxes.forEach(function (b) { if (b.checked) n++; });
          count.textContent = n === boxes.length ? "All packed. Let's bake!" : n + " of " + boxes.length + " in the basket";
        }
        boxes.forEach(function (b) { b.addEventListener("change", upd); });
        upd();
      });

      function select(i, focus) {
        panels.forEach(function (p, k) {
          var on = k === i;
          p.hidden = !on;
          p.classList.remove("enter");
          tagEls[k].setAttribute("aria-selected", on ? "true" : "false");
          tagEls[k].tabIndex = on ? 0 : -1;
        });
        void panels[i].offsetWidth;
        panels[i].classList.add("enter");
        if (focus) tagEls[i].focus();
        try { history.replaceState(null, "", "#" + RECIPES[i].slug); } catch (e) {}
      }

      var start = 0;
      RECIPES.forEach(function (r, i) { if (location.hash === "#" + r.slug) start = i; });
      select(start, false);
    })();
  </script>
</body>
</html>
