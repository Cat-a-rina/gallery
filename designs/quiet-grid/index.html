<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiet Grid — Three recipes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --white: #ffffff; --ink: #111111; --red: #e10600; --rule: #e5e5e5; --mute: #767676;
      --sans: "Work Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; --mono: "IBM Plex Mono", "Courier New", monospace; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--white); color: var(--ink); font-family: var(--sans); font-weight: 300; font-size: 14px; line-height: 1.65; }
    a { color: inherit; }
    :focus-visible { outline: 1px solid var(--red); outline-offset: 4px; }
    .label { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }

    .follower { position: fixed; left: 14px; top: 0; width: 14px; height: 14px; border-radius: 50%; background: var(--red); z-index: 5; pointer-events: none; will-change: transform; }

    .page { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 24px; max-width: 1400px; margin: 0 auto; padding: 0 48px 0 64px; }
    aside { grid-column: 1 / 4; position: sticky; top: 0; align-self: start; height: 100vh; padding: 40px 0; display: flex; flex-direction: column; justify-content: space-between; }
    aside ol { list-style: none; margin: 0; padding: 0; }
    aside li { position: relative; padding-left: 22px; }
    aside li a { display: block; text-decoration: none; padding: 6px 0; font-family: var(--mono); font-size: 11px; color: var(--mute); transition: color .3s; }
    aside li a .n { color: var(--ink); }
    aside li a small { display: block; font-family: var(--sans); font-size: 11px; font-weight: 300; }
    aside li::before { content: ""; position: absolute; left: 0; top: 14px; width: 6px; height: 6px; border-radius: 50%; background: var(--red); transform: scale(0); transition: transform .3s; }
    aside li.on::before { transform: scale(1); }
    aside li.on a { color: var(--ink); }
    .back { font-family: var(--mono); font-size: 11px; text-decoration: none; border-bottom: 1px solid var(--rule); align-self: flex-start; padding-bottom: 2px; }
    .back:hover { border-color: var(--red); }

    main { grid-column: 5 / 13; }
    .intro { min-height: 70vh; display: flex; flex-direction: column; justify-content: flex-end; padding: 40px 0 72px; border-bottom: 1px solid var(--rule); }
    .intro h1 { font-weight: 300; font-size: 14px; margin: 0 0 8px; letter-spacing: 0; }
    .intro p { margin: 0; max-width: 24em; color: var(--mute); }
    section.recipe { padding: 120px 0 96px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: repeat(8, 1fr); column-gap: 24px; }
    .head { grid-column: 1 / 9; margin-bottom: 56px; }
    .head h2 { font-weight: 300; font-size: clamp(22px, 3vw, 30px); line-height: 1.2; margin: 12px 0 8px; letter-spacing: -.01em; }
    .head p { margin: 0; color: var(--mute); max-width: 26em; }
    dl.meta { grid-column: 1 / 9; display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 24px; margin: 0 0 56px; border-top: 1px solid var(--rule); }
    dl.meta div { padding: 10px 0; border-bottom: 1px solid var(--rule); }
    dl.meta dt { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
    dl.meta dd { margin: 2px 0 0; font-weight: 400; font-size: 13px; }
    .ing { grid-column: 1 / 9; margin-bottom: 56px; }
    .ing h3, .steps h3 { margin: 0 0 12px; font-weight: 400; }
    .ing ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; column-gap: 48px; border-top: 1px solid var(--rule); }
    .ing li { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
    .ing .q { font-family: var(--mono); font-size: 11px; white-space: nowrap; text-align: right; padding-top: 2px; }
    .steps { grid-column: 3 / 9; }
    .steps ol { list-style: none; margin: 0; padding: 0; counter-reset: s; }
    .steps li { position: relative; padding: 0 0 20px; max-width: 34em; }
    .steps li .label { position: absolute; left: -48px; top: 3px; }
    footer { padding: 48px 0 96px; }

    @media (max-width: 860px) {
      .page { display: block; padding: 0 20px 0 36px; }
      aside { position: sticky; z-index: 4; height: auto; padding: 10px 0; flex-direction: row; align-items: center; background: var(--white); border-bottom: 1px solid var(--rule); }
      aside ol { display: flex; gap: 14px; }
      aside li { padding-left: 12px; }
      aside li::before { top: 13px; width: 5px; height: 5px; }
      aside li a small { display: none; }
      .follower { left: 10px; width: 10px; height: 10px; }
      .intro { min-height: 50vh; }
      section.recipe { display: block; padding: 72px 0 64px; }
      .ing ul { grid-template-columns: 1fr; }
      dl.meta { grid-template-columns: 1fr; }
      .steps li .label { position: static; display: block; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } aside li::before, aside li a { transition: none; } }
  </style>
</head>
<body>
  <div class="follower" id="dot" aria-hidden="true"></div>
  <div class="page">
    <aside>
      <a class="back" href="../../index.html">&larr; Gallery</a>
      <nav aria-label="Recipes"><ol id="index"></ol></nav>
      <span class="label">Quiet Grid</span>
    </aside>
    <main>
      <header class="intro">
        <h1>Three recipes.</h1>
        <p>Flour, water, heat. Read slowly.</p>
      </header>
      <div id="recipes"></div>
      <footer class="label">End.</footer>
    </main>
  </div>

  <script src="../../recipes.js"></script>
  <script>
    (function () {
      var pad = function (n) { return String(n).padStart(2, "0"); };
      var esc = function (s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; };
      function parse(t) {
        var m = t.match(/^(\d+(?:\.\d+)?(?:\s?(?:g|ml|tsp|tbsp|kg|l))?)\s+(.+)$/i);
        return m ? { q: m[1], i: m[2] } : { q: "—", i: t };
      }
      var idx = document.getElementById("index"), box = document.getElementById("recipes");
      RECIPES.forEach(function (r, i) {
        var n = pad(i + 1);
        var li = document.createElement("li");
        li.innerHTML = '<a href="#' + esc(r.slug) + '"><span class="n">' + n + '</span> / ' + (i + 1) + '<small>' + esc(r.name) + '</small></a>';
        idx.appendChild(li);
        var s = document.createElement("section");
        s.className = "recipe"; s.id = r.slug; s.setAttribute("aria-labelledby", "h-" + r.slug);
        s.innerHTML =
          '<div class="head"><span class="label">' + n + '</span><h2 id="h-' + esc(r.slug) + '">' + esc(r.name) + '</h2><p>' + esc(r.tagline) + '</p></div>' +
          '<dl class="meta"><div><dt>Time</dt><dd>' + esc(r.time) + '</dd></div><div><dt>Yield</dt><dd>' + esc(r.yield) + '</dd></div><div><dt>Level</dt><dd>' + esc(r.difficulty) + '</dd></div></dl>' +
          '<div class="ing"><h3 class="label">Ingredients</h3><ul>' +
          r.ingredients.map(function (t) { var p = parse(t); return '<li><span>' + esc(p.i) + '</span><span class="q">' + esc(p.q) + '</span></li>'; }).join("") +
          '</ul></div>' +
          '<div class="steps"><h3 class="label">Method</h3><ol>' +
          r.steps.map(function (t, k) { return '<li><span class="label">' + pad(k + 1) + '</span>' + esc(t) + '</li>'; }).join("") +
          '</ol></div>';
        box.appendChild(s);
      });

      var items = idx.querySelectorAll("li"), secs = box.querySelectorAll("section");
      function setOn(k) { items.forEach(function (el, j) { el.classList.toggle("on", j === k); }); }
      setOn(0);
      if ("IntersectionObserver" in window) {
        var io = new IntersectionObserver(function (es) {
          es.forEach(function (e) { if (e.isIntersecting) setOn(Array.prototype.indexOf.call(secs, e.target)); });
        }, { rootMargin: "-40% 0px -55% 0px" });
        secs.forEach(function (s) { io.observe(s); });
      }

      var dot = document.getElementById("dot"), tick = false;
      function place() {
        tick = false;
        var max = document.documentElement.scrollHeight - innerHeight;
        var p = max > 0 ? scrollY / max : 0;
        var size = dot.offsetHeight;
        dot.style.transform = "translateY(" + (p * (innerHeight - size - 40) + 20).toFixed(1) + "px)";
      }
      addEventListener("scroll", function () { if (!tick) { tick = true; requestAnimationFrame(place); } }, { passive: true });
      addEventListener("resize", place);
      place();
    })();
  </script>
</body>
</html>
