<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Still Life — Three quiet bakes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400&family=Shippori+Mincho:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f2f1ea; --stone: #e4e5da; --ink: #2f342c; --soft: #74806d; --hair: rgba(47, 52, 44, .2);
      --moss: #4f6b4a; --sage: #a3b496;
      --serif: "Shippori Mincho", "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
      --sans: "Mulish", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; color: var(--ink); font-family: var(--sans); font-weight: 300; font-size: 15px; line-height: 1.9; letter-spacing: .02em;
      background: var(--paper) linear-gradient(180deg, var(--paper) 0, var(--paper) 55%, var(--stone) 100%) no-repeat;
    }
    a { color: inherit; text-underline-offset: 5px; text-decoration-thickness: 1px; }
    :focus-visible { outline: 1px solid var(--moss); outline-offset: 6px; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    .back { position: absolute; top: 28px; left: 32px; font-size: 12px; text-decoration: none; color: var(--soft); border-bottom: 1px solid var(--hair); line-height: 1.6; }
    .back:hover { color: var(--moss); border-color: var(--moss); }

    /* the composition is centered in a single quiet column */
    .comp { width: min(100%, 720px); margin: 0 auto; padding: 0 32px 16vh; }
    .intro { min-height: 82vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10vh 0; }
    .ridge { width: min(320px, 70%); color: var(--sage); margin: 0 0 34px; }
    .intro p { margin: 0 0 28px; color: var(--soft); max-width: 24em; }
    .intro nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 26px; font-family: var(--serif); font-size: 14px; }
    .intro nav a { text-decoration: none; border-bottom: 1px solid var(--hair); padding-bottom: 2px; }
    .intro nav a:hover { border-color: var(--moss); color: var(--moss); }

    section.recipe { padding: 16vh 0 6vh; border-top: 1px solid var(--hair); position: relative; }
    .row { display: grid; grid-template-columns: auto 1fr; column-gap: 44px; }
    .title { display: flex; flex-direction: column; align-items: center; gap: 26px; }
    .title h2 { writing-mode: vertical-rl; margin: 0; font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1.5; letter-spacing: .32em; }
    .seal { width: 30px; height: 30px; display: block; flex: none; }
    .col { padding-top: 6px; min-width: 0; }
    .plant { width: 150px; height: 150px; display: block; margin: 0 0 22px -10px; color: var(--moss); overflow: visible; }
    .tag { font-family: var(--serif); font-size: 16px; margin: 0 0 30px; line-height: 1.9; }
    dl.meta { margin: 0 0 46px; }
    dl.meta div { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--hair); padding: 6px 0; }
    dl.meta div:last-child { border-bottom: 1px solid var(--hair); }
    dl.meta dt { color: var(--soft); font-size: 12px; letter-spacing: .12em; }
    dl.meta dd { margin: 0; text-align: right; }
    h3 { margin: 0 0 14px; font-family: var(--serif); font-weight: 400; font-size: 13px; letter-spacing: .3em; color: var(--soft); }
    ul.shelf { list-style: none; margin: 0 0 54px; padding: 0; }
    ul.shelf li { padding: 22px 0 6px; border-bottom: 1px solid var(--hair); }
    ol.steps { list-style: none; margin: 0; padding: 0; }
    ol.steps li { display: grid; grid-template-columns: 2.2em 1fr; padding: 0 0 22px; }
    ol.steps .n { font-family: var(--serif); color: var(--moss); }
    .end { padding: 12vh 0 0; text-align: center; font-family: var(--serif); letter-spacing: .3em; color: var(--soft); font-size: 13px; }
    .end svg { display: block; margin: 0 auto 14px; width: 26px; color: var(--sage); }

    .rv { opacity: 0; transition: opacity 800ms ease; }
    .rv.in { opacity: 1; }

    @media (max-width: 700px) {
      body { font-size: 14.5px; }
      .comp { padding: 0 24px 12vh; }
      .back { left: 24px; top: 20px; }
      .intro { min-height: 74vh; }
      .row { display: block; }
      .title { flex-direction: row-reverse; justify-content: space-between; align-items: flex-start; margin-bottom: 26px; }
      .title h2 { writing-mode: horizontal-tb; font-size: 25px; letter-spacing: .14em; }
      .plant { width: 120px; height: 120px; }
      section.recipe { padding-top: 12vh; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .rv { transition: none; opacity: 1; } }
  </style>
</head>
<body>
  <a class="back" href="../../index.html">&larr; Gallery</a>
  <main class="comp">
    <header class="intro rv">
      <svg class="ridge" viewBox="0 0 320 40" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true" focusable="false">
        <path d="M2 34 C40 30 52 12 84 14 C112 16 120 30 150 24 C186 16 196 4 230 8 C262 12 276 28 318 26"/>
        <path d="M2 38 H318" stroke-opacity=".5"/>
      </svg>
      <h1 class="sr-only">Still Life</h1>
      <p>Three bakes for a morning with nothing on the calendar. Take your time.</p>
      <nav aria-label="Recipes" id="nav"></nav>
    </header>
    <div id="recipes"></div>
    <p class="end rv">
      <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M13 24C4 18 4 8 13 2c9 6 9 16 0 22zM13 24V8"/></svg>
      fin
    </p>
  </main>

  <script src="../../recipes.js"></script>
  <script>
    (function () {
      var NUM = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
      var esc = function (s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; };
      var f = function (n) { return n.toFixed(1); };

      function rng(seed) {
        var a = seed >>> 0;
        return function () {
          a = (a + 0x6D2B79F5) >>> 0;
          var t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

      // grain: a small pointed ellipse, rotated about its own center
      function grain(x, y, rot, rx, ry) {
        return '<ellipse cx="' + f(x) + '" cy="' + f(y) + '" rx="' + rx + '" ry="' + ry + '" transform="rotate(' + f(rot) + ' ' + f(x) + ' ' + f(y) + ')"/>';
      }

      // one line-drawn plant per bake: wheat ear, rosemary sprig, leaf
      var DRAW = {
        wheat: function (rnd) {
          var lean = (rnd() - 0.5) * 8, out = '<path d="M' + f(50 - lean) + ' 96 C' + f(50 - lean / 2) + ' 70 ' + f(50 + lean / 2) + ' 50 ' + f(50 + lean) + ' 30"/>';
          for (var k = 0; k < 6; k++) {
            var y = 34 + k * 9, x = 50 + lean * (1 - k / 7), w = 4.4 - k * 0.15, s = 24 + rnd() * 6;
            out += grain(x - 5.5, y, -s, w * 0.72, 6.2) + grain(x + 5.5, y, s, w * 0.72, 6.2);
          }
          out += grain(50 + lean, 22, 0, 3.2, 7);
          out += '<path d="M' + f(50 + lean) + ' 15 V2 M' + f(44 + lean) + ' 30 L' + f(36 + lean) + ' 6 M' + f(56 + lean) + ' 30 L' + f(64 + lean) + ' 6" stroke-opacity=".7"/>';
          return out;
        },
        sprig: function (rnd) {
          var bend = 14 + rnd() * 8, x0 = 30, y0 = 96, cx = 30 - bend, cy = 50, x1 = 70, y1 = 8;
          var out = '<path d="M' + x0 + ' ' + y0 + ' Q' + f(cx + 20) + ' ' + cy + ' ' + x1 + ' ' + y1 + '"/>';
          for (var k = 1; k <= 11; k++) {
            var t = k / 12, qx = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * (cx + 20) + t * t * x1, qy = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * cy + t * t * y1;
            var tx = 2 * (1 - t) * ((cx + 20) - x0) + 2 * t * (x1 - (cx + 20)), ty = 2 * (1 - t) * (cy - y0) + 2 * t * (y1 - cy);
            var ang = Math.atan2(ty, tx), len = 8 + rnd() * 4 - t * 2;
            [-1, 1].forEach(function (side) {
              var a = ang + side * (0.9 + rnd() * 0.15);
              out += '<path d="M' + f(qx) + ' ' + f(qy) + ' L' + f(qx + len * Math.cos(a)) + ' ' + f(qy + len * Math.sin(a)) + '"/>';
            });
          }
          return out;
        },
        leaf: function (rnd) {
          var w = 22 + rnd() * 6, tilt = (rnd() - 0.5) * 10;
          var out = '<g transform="rotate(' + f(tilt) + ' 50 50)">' +
            '<path d="M50 94 C' + f(50 - w - 8) + ' 70 ' + f(50 - w) + ' 28 50 6 C' + f(50 + w) + ' 28 ' + f(50 + w + 8) + ' 70 50 94Z"/>' +
            '<path d="M50 98 V12"/>';
          for (var k = 0; k < 5; k++) {
            var y = 76 - k * 13, d = 8 + (4 - Math.abs(k - 1.5)) * 3.4;
            out += '<path d="M50 ' + f(y) + ' L' + f(50 - d) + ' ' + f(y - 10) + ' M50 ' + f(y) + ' L' + f(50 + d) + ' ' + f(y - 10) + '" stroke-opacity=".8"/>';
          }
          return out + '</g>';
        }
      };
      var KINDS = ["wheat", "sprig", "leaf"];
      function plant(slug, i) {
        var rnd = rng(hash(slug));
        return '<svg class="plant" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
          DRAW[KINDS[i % KINDS.length]](rnd) + '</svg>';
      }

      // small moss seal: a round mark holding a tiny leaf, rotated a little differently per bake
      function seal(i) {
        var rot = [-18, 12, -6][i % 3];
        return '<svg class="seal" viewBox="0 0 34 34" aria-hidden="true" focusable="false">' +
          '<circle cx="17" cy="17" r="16" fill="#4f6b4a"/>' +
          '<g fill="none" stroke="#f2f1ea" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" transform="rotate(' + rot + ' 17 17)">' +
          '<path d="M17 27 C10 22 10 12 17 7 C24 12 24 22 17 27Z M17 27 V12"/></g></svg>';
      }

      function parse(t) {
        var m = t.match(/^(\d+(?:\.\d+)?(?:\s?(?:g|ml|tsp|tbsp|kg|l))?)\s+(.+)$/i);
        return m ? m[0] : t;
      }

      var nav = document.getElementById("nav"), box = document.getElementById("recipes");
      RECIPES.forEach(function (r, i) {
        var a = document.createElement("a");
        a.href = "#" + r.slug; a.textContent = NUM[i] + " " + r.name.split(" ")[0];
        nav.appendChild(a);

        var s = document.createElement("section");
        s.className = "recipe"; s.id = r.slug; s.setAttribute("aria-labelledby", "h-" + r.slug);
        s.innerHTML =
          '<div class="row">' +
            '<div class="title rv"><h2 id="h-' + esc(r.slug) + '">' + esc(r.name) + '</h2>' + seal(i) + '</div>' +
            '<div class="col">' +
              '<div class="rv">' + plant(r.slug, i) + '<p class="tag">' + esc(r.tagline) + '</p>' +
              '<dl class="meta"><div><dt>Time</dt><dd>' + esc(r.time) + '</dd></div><div><dt>Makes</dt><dd>' + esc(r.yield) + '</dd></div><div><dt>Level</dt><dd>' + esc(r.difficulty) + '</dd></div></dl></div>' +
              '<div class="rv"><h3>Ingredients</h3><ul class="shelf">' +
                r.ingredients.map(function (t) { return '<li>' + esc(parse(t)) + '</li>'; }).join("") +
              '</ul></div>' +
              '<div class="rv"><h3>Method</h3><ol class="steps">' +
                r.steps.map(function (t, k) { return '<li><span class="n" aria-hidden="true">' + NUM[k] + '</span><span>' + esc(t) + '</span></li>'; }).join("") +
              '</ol></div>' +
            '</div>' +
          '</div>';
        box.appendChild(s);
      });

      var els = document.querySelectorAll(".rv");
      if ("IntersectionObserver" in window && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        var io = new IntersectionObserver(function (es) {
          es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
        }, { rootMargin: "0px 0px -10% 0px", threshold: 0.05 });
        els.forEach(function (el) { io.observe(el); });
      } else {
        els.forEach(function (el) { el.classList.add("in"); });
      }
    })();
  </script>
</body>
</html>
