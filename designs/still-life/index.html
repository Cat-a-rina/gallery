<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Still Life — Three quiet bakes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400&family=Shippori+Mincho:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --oat: #ece4d6; --paper: #f6f1e7; --ink: #3a342c; --soft: #7a7064; --hair: rgba(58, 52, 44, .22);
      --persimmon: #c8623b;
      --serif: "Shippori Mincho", "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
      --sans: "Mulish", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 300; font-size: 15px; line-height: 1.9; letter-spacing: .02em; }
    a { color: inherit; text-underline-offset: 5px; text-decoration-thickness: 1px; }
    :focus-visible { outline: 1px solid var(--ink); outline-offset: 6px; }

    .back { position: absolute; top: 28px; left: 32px; font-size: 12px; text-decoration: none; color: var(--soft); border-bottom: 1px solid var(--hair); line-height: 1.6; }
    .back:hover { color: var(--ink); border-color: var(--ink); }

    /* the composition lives on the right; the left ~60% stays empty */
    .comp { margin-left: 56%; width: min(40%, 560px); padding: 0 0 18vh; min-width: 420px; }
    .intro { min-height: 92vh; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 0 12vh; }
    .intro h1 { font-family: var(--serif); font-weight: 400; font-size: 20px; letter-spacing: .3em; margin: 0 0 18px; }
    .intro p { margin: 0 0 28px; color: var(--soft); max-width: 22em; }
    .intro nav { display: flex; gap: 22px; font-family: var(--serif); font-size: 14px; }
    .intro nav a { text-decoration: none; border-bottom: 1px solid var(--hair); padding-bottom: 2px; }
    .intro nav a:hover { border-color: var(--ink); }

    section.recipe { padding: 18vh 0 6vh; border-top: 1px solid var(--hair); position: relative; }
    .row { display: grid; grid-template-columns: auto 1fr; column-gap: 44px; }
    .title { display: flex; flex-direction: column; align-items: center; gap: 26px; }
    .title h2 { writing-mode: vertical-rl; margin: 0; font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1.5; letter-spacing: .32em; }
    .seal { width: 34px; height: 34px; display: block; flex: none; }
    .col { padding-top: 6px; min-width: 0; }
    .enso { width: 150px; height: 150px; display: block; margin: 0 0 26px -14px; color: var(--ink); }
    .tag { font-family: var(--serif); font-size: 16px; margin: 0 0 30px; line-height: 1.9; }
    dl.meta { margin: 0 0 46px; }
    dl.meta div { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--hair); padding: 6px 0; }
    dl.meta div:last-child { border-bottom: 1px solid var(--hair); }
    dl.meta dt { color: var(--soft); font-size: 12px; letter-spacing: .12em; }
    dl.meta dd { margin: 0; text-align: right; }
    h3 { margin: 0 0 14px; font-family: var(--serif); font-weight: 400; font-size: 13px; letter-spacing: .3em; color: var(--soft); }
    ul.shelf { list-style: none; margin: 0 0 54px; padding: 0; }
    ul.shelf li { padding: 22px 0 6px; border-bottom: 1px solid var(--hair); }
    ol.steps { list-style: none; margin: 0; padding: 0; }
    ol.steps li { display: grid; grid-template-columns: 2.2em 1fr; padding: 0 0 22px; }
    ol.steps .n { font-family: var(--serif); color: var(--soft); }
    .end { padding: 12vh 0 0; font-family: var(--serif); letter-spacing: .3em; color: var(--soft); font-size: 13px; }

    .rv { opacity: 0; transition: opacity 800ms ease; }
    .rv.in { opacity: 1; }
    .nojs .rv { opacity: 1; }

    @media (max-width: 1000px) { .comp { margin-left: 34%; width: 62%; min-width: 0; } .back { left: 20px; } }
    @media (max-width: 700px) {
      body { font-size: 14.5px; }
      .comp { margin: 0; width: auto; padding: 0 28px 12vh 44px; }
      .back { left: 28px; top: 20px; }
      .intro { min-height: 80vh; }
      .row { display: block; }
      .title { flex-direction: row-reverse; justify-content: space-between; align-items: flex-start; margin-bottom: 26px; }
      .title h2 { writing-mode: horizontal-tb; font-size: 25px; letter-spacing: .14em; }
      .enso { width: 120px; height: 120px; }
      section.recipe { padding-top: 12vh; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .rv { transition: none; opacity: 1; } }
  </style>
</head>
<body>
  <a class="back" href="../../index.html">&larr; Gallery</a>
  <main class="comp">
    <header class="intro rv">
      <h1>静物 &nbsp;Still Life</h1>
      <p>Three bakes for a morning with nothing on the calendar. Take your time.</p>
      <nav aria-label="Recipes" id="nav"></nav>
    </header>
    <div id="recipes"></div>
    <p class="end rv">&middot; &nbsp;fin&nbsp; &middot;</p>
  </main>

  <script src="../../recipes.js"></script>
  <script>
    (function () {
      var NUM = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
      var esc = function (s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; };

      function rng(seed) {
        var a = seed >>> 0;
        return function () {
          a = (a + 0x6D2B79F5) >>> 0;
          var t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

      // brush circle: tapered ribbon with a wobbling radius, plus a dry-brush ghost line
      function enso(slug) {
        var rnd = rng(hash(slug));
        var start = rnd() * Math.PI * 2, sweep = (285 + rnd() * 55) * Math.PI / 180;
        var r0 = 38 + rnd() * 4, drift = (rnd() - 0.5) * 8;
        var p1 = rnd() * 6.28, p2 = rnd() * 6.28, a1 = 0.8 + rnd() * 1.2, a2 = 0.4 + rnd() * 0.6;
        var wmax = 5 + rnd() * 3, N = 80, outer = [], inner = [], ghost = [];
        for (var i = 0; i <= N; i++) {
          var t = i / N, ang = start + sweep * t;
          var r = r0 + drift * t + a1 * Math.sin(t * 5 + p1) + a2 * Math.sin(t * 13 + p2);
          var w = 0.8 + wmax * Math.pow(1 - t, 0.8) * (0.85 + 0.15 * Math.sin(t * 9 + p1)) + (t < 0.06 ? t * 20 : 0);
          var c = Math.cos(ang), s = Math.sin(ang);
          outer.push((50 + (r + w / 2) * c).toFixed(1) + " " + (50 + (r + w / 2) * s).toFixed(1));
          inner.push((50 + (r - w / 2) * c).toFixed(1) + " " + (50 + (r - w / 2) * s).toFixed(1));
          if (t > 0.35) ghost.push((50 + (r - w * 0.15) * c).toFixed(1) + " " + (50 + (r - w * 0.15) * s).toFixed(1));
        }
        var d = "M" + outer.join(" L") + " L" + inner.reverse().join(" L") + " Z";
        var g = ghost.length ? "M" + ghost.join(" L") : "";
        return '<svg class="enso" viewBox="0 0 100 100" aria-hidden="true" focusable="false">' +
          '<path d="' + d + '" fill="currentColor" fill-opacity=".86"/>' +
          (g ? '<path d="' + g + '" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width=".5" stroke-linecap="round"/>' : "") +
          '</svg>';
      }

      // hanko: persimmon square with a character-like mark, one per bake
      var MARKS = [
        '<path d="M9 9h16v16H9zM17 9v16M9 17h16"/>',
        '<path d="M9 10h16M11 17h12M8 24h18M17 10v14"/>',
        '<path d="M17 8v17M9 16v9M25 16v9M9 25h16"/>'
      ];
      function seal(i) {
        return '<svg class="seal" viewBox="0 0 34 34" aria-hidden="true" focusable="false">' +
          '<rect x="1" y="1" width="32" height="32" rx="2" fill="#c8623b"/>' +
          '<g fill="none" stroke="#f6f1e7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 0)">' +
          MARKS[i % MARKS.length] + '</g></svg>';
      }

      function parse(t) {
        var m = t.match(/^(\d+(?:\.\d+)?(?:\s?(?:g|ml|tsp|tbsp|kg|l))?)\s+(.+)$/i);
        return m ? m[0] : t;
      }

      var nav = document.getElementById("nav"), box = document.getElementById("recipes");
      RECIPES.forEach(function (r, i) {
        var a = document.createElement("a");
        a.href = "#" + r.slug; a.textContent = NUM[i] + " " + r.name.split(" ")[0];
        nav.appendChild(a);

        var s = document.createElement("section");
        s.className = "recipe"; s.id = r.slug; s.setAttribute("aria-labelledby", "h-" + r.slug);
        s.innerHTML =
          '<div class="row">' +
            '<div class="title rv"><h2 id="h-' + esc(r.slug) + '">' + esc(r.name) + '</h2>' + seal(i) + '</div>' +
            '<div class="col">' +
              '<div class="rv">' + enso(r.slug) + '<p class="tag">' + esc(r.tagline) + '</p>' +
              '<dl class="meta"><div><dt>Time</dt><dd>' + esc(r.time) + '</dd></div><div><dt>Makes</dt><dd>' + esc(r.yield) + '</dd></div><div><dt>Level</dt><dd>' + esc(r.difficulty) + '</dd></div></dl></div>' +
              '<div class="rv"><h3>Ingredients</h3><ul class="shelf">' +
                r.ingredients.map(function (t) { return '<li>' + esc(parse(t)) + '</li>'; }).join("") +
              '</ul></div>' +
              '<div class="rv"><h3>Method</h3><ol class="steps">' +
                r.steps.map(function (t, k) { return '<li><span class="n" aria-hidden="true">' + NUM[k] + '</span><span>' + esc(t) + '</span></li>'; }).join("") +
              '</ol></div>' +
            '</div>' +
          '</div>';
        box.appendChild(s);
      });

      var els = document.querySelectorAll(".rv");
      if ("IntersectionObserver" in window && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        var io = new IntersectionObserver(function (es) {
          es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
        }, { rootMargin: "0px 0px -10% 0px", threshold: 0.05 });
        els.forEach(function (el) { io.observe(el); });
      } else {
        els.forEach(function (el) { el.classList.add("in"); });
      }
    })();
  </script>
</body>
</html>
