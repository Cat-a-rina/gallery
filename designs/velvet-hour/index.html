<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Velvet Hour — Three Recipes for Evening</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400;1,500&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1c0a14; --bg2: #26101c; --champagne: #e8d3a8; --rose: #c98b7b; --ivory: #f5ece0;
      --dim: rgba(245, 236, 224, .68); --line: rgba(232, 211, 168, .28);
      --display: "Bodoni Moda", "Didot", "Bodoni 72", "Playfair Display", Georgia, serif;
      --sans: "Raleway", "Helvetica Neue", Arial, sans-serif;
      --bar: 4.5rem;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ivory); font-family: var(--sans); font-weight: 300; line-height: 1.75; }
    a { color: inherit; }
    :focus-visible { outline: 1px solid var(--champagne); outline-offset: 4px; }
    .smallcaps { font-variant: small-caps; letter-spacing: .28em; text-transform: lowercase; font-weight: 400; }

    .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 100vh; }

    /* LEFT */
    .stage {
      position: sticky; top: 0; height: 100vh; overflow: hidden; padding: 2.5rem clamp(1.5rem, 4vw, 4rem);
      display: flex; flex-direction: column; justify-content: space-between;
      background: radial-gradient(ellipse at 20% 100%, #3a1528 0, transparent 60%), var(--bg);
      border-right: 1px solid var(--line);
    }
    .back { align-self: flex-start; text-decoration: none; font-size: .78rem; color: var(--champagne); transition: color .3s, letter-spacing .4s; }
    .back:hover { color: var(--rose); letter-spacing: .34em; }
    .titles { position: relative; flex: 1; display: flex; align-items: center; }
    .big {
      position: absolute; left: 0; right: 0; margin: 0; font-family: var(--display); font-style: italic; font-weight: 400;
      font-size: clamp(3.4rem, 7.2vw, 7.5rem); line-height: .98; letter-spacing: -.01em; color: var(--ivory);
      opacity: 0; transform: translateY(24px); filter: blur(6px);
      transition: opacity .9s ease, transform .9s ease, filter .9s ease;
    }
    .big.on { opacity: 1; transform: none; filter: none; }
    .big span { display: block; color: var(--champagne); }
    .stage-foot { display: flex; align-items: center; justify-content: space-between; font-size: .72rem; color: var(--rose); }
    .dots { display: flex; gap: .6rem; }
    .dots button { width: 2.2rem; height: 1px; padding: 1rem 0; background: var(--line) content-box; border: 0; cursor: pointer; transition: background .4s; }
    .dots button.on, .dots button:hover { background: var(--champagne) content-box; }
    .stage .corner { position: absolute; width: clamp(120px, 16vw, 220px); height: auto; color: var(--champagne); opacity: .55; pointer-events: none; }
    .stage .tr { top: 0; right: 0; transform: scaleX(-1); }
    .stage .bl { bottom: 0; left: 0; transform: scaleY(-1); opacity: .3; }

    /* RIGHT */
    .scroll { min-width: 0; }
    .intro { padding: clamp(5rem, 14vh, 9rem) clamp(1.5rem, 5vw, 5rem) 2rem; }
    .intro p { margin: 0; max-width: 26rem; font-size: .95rem; color: var(--dim); }
    .intro .kicker { color: var(--rose); font-size: .8rem; margin-bottom: 1rem; }
    .recipe { position: relative; min-height: 100vh; padding: clamp(5rem, 14vh, 9rem) clamp(1.5rem, 5vw, 5rem); border-top: 1px solid var(--line); overflow: hidden; }
    .recipe .corner { position: absolute; top: 0; right: 0; width: 130px; color: var(--rose); opacity: .5; }
    .numeral {
      position: absolute; right: -.05em; bottom: -.18em; font-family: var(--display); font-style: italic; font-size: clamp(14rem, 30vw, 28rem);
      line-height: 1; color: var(--champagne); opacity: .05; pointer-events: none; user-select: none;
    }
    .recipe > :not(.corner):not(.numeral) { position: relative; }
    .recipe h2 { font-family: var(--display); font-style: italic; font-weight: 400; font-size: clamp(1.8rem, 3vw, 2.6rem); margin: 0 0 .75rem; color: var(--champagne); }
    .tagline { font-family: var(--display); font-style: italic; font-size: 1.15rem; color: var(--ivory); margin: 0 0 2.5rem; max-width: 28rem; }
    .meta { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 2rem; margin: 0 0 3rem; padding: 1.1rem 0; border-block: 1px solid var(--line); }
    .meta dt { font-size: .7rem; color: var(--rose); }
    .meta dd { margin: 0; font-size: .92rem; }
    .recipe h3 { font-size: .8rem; color: var(--champagne); margin: 0 0 1.25rem; display: flex; align-items: center; gap: 1rem; }
    .recipe h3::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
    ul, ol { list-style: none; margin: 0; padding: 0; }
    .ingr { margin-bottom: 3rem; columns: 1; }
    .ingr li { padding: .5rem 0 .5rem 1.6rem; position: relative; border-bottom: 1px solid rgba(232,211,168,.1); }
    .ingr li::before { content: ""; position: absolute; left: .2rem; top: 1.1rem; width: 6px; height: 6px; border: 1px solid var(--rose); transform: rotate(45deg); }
    .steps { counter-reset: s; }
    .steps li { counter-increment: s; position: relative; padding: .6rem 0 1rem 3.2rem; }
    .steps li::before { content: counter(s, upper-roman); position: absolute; left: 0; top: .45rem; font-family: var(--display); font-style: italic; font-size: 1.3rem; color: var(--rose); }
    .reveal { opacity: 0; transform: translateY(18px); transition: opacity .9s ease, transform .9s ease; }
    .reveal.in { opacity: 1; transform: none; }
    footer { padding: 4rem 1.5rem; text-align: center; font-size: .75rem; color: var(--rose); border-top: 1px solid var(--line); }

    /* MOBILE */
    .mbar { display: none; }
    @media (max-width: 860px) {
      .split { display: block; }
      .stage { position: sticky; top: 0; z-index: 10; height: var(--bar); padding: 0 1rem; flex-direction: row; align-items: center; gap: 1rem; border-right: 0; border-bottom: 1px solid var(--line); background: rgba(28, 10, 20, .94); backdrop-filter: blur(8px); }
      .stage .corner, .stage-foot { display: none; }
      .back { font-size: .68rem; letter-spacing: .15em; flex: none; }
      .titles { height: 100%; flex: 1; min-width: 0; }
      .big { font-size: clamp(1.3rem, 6vw, 1.8rem); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; top: 50%; transform: translateY(calc(-50% + 12px)); }
      .big.on { transform: translateY(-50%); }
      .big span { display: inline; }
      .recipe { min-height: 0; scroll-margin-top: var(--bar); }
      .intro { padding-top: 3rem; }
      .meta { grid-template-columns: 1fr 1fr; gap: 1rem 2rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .big, .reveal, .back, .dots button { transition: none !important; filter: none !important; }
      .reveal { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="split">
    <aside class="stage" aria-label="Current recipe">
      <svg class="corner tr" viewBox="0 0 100 100" aria-hidden="true"></svg>
      <svg class="corner bl" viewBox="0 0 100 100" aria-hidden="true"></svg>
      <a class="back smallcaps" href="../../index.html">&larr; the gallery</a>
      <div class="titles" id="titles" aria-hidden="true"></div>
      <div class="stage-foot">
        <span class="smallcaps" id="count">no. i of iii</span>
        <nav class="dots" id="dots" aria-label="Jump to recipe"></nav>
      </div>
    </aside>

    <main class="scroll" id="scroll">
      <header class="intro">
        <p class="kicker smallcaps">after dusk &middot; before midnight</p>
        <p>Three recipes, made unhurriedly. Scroll slowly; the evening will meet you halfway.</p>
      </header>
    </main>
  </div>
  <footer class="smallcaps">Made with patience &middot; served by candlelight</footer>

  <script src="../../recipes.js"></script>
  <script>
    (function () {
      var romans = ["I", "II", "III", "IV", "V"];
      var lower = ["i", "ii", "iii", "iv", "v"];
      var NS = "http://www.w3.org/2000/svg";

      // Art Deco fan: radiating lines + concentric arcs from the top-left corner.
      function fanMarkup() {
        var s = "", i, a, r;
        for (i = 0; i <= 8; i++) {
          a = (i / 8) * Math.PI / 2;
          s += '<line x1="0" y1="0" x2="' + (96 * Math.cos(a)).toFixed(1) + '" y2="' + (96 * Math.sin(a)).toFixed(1) + '"/>';
        }
        for (r = 24; r <= 96; r += 24) {
          s += '<path d="M' + r + ' 0 A' + r + ' ' + r + ' 0 0 1 0 ' + r + '"/>';
        }
        return '<g fill="none" stroke="currentColor" stroke-width=".7">' + s + '</g>';
      }
      document.querySelectorAll("svg.corner").forEach(function (el) { el.innerHTML = fanMarkup(); });

      var titles = document.getElementById("titles");
      var dots = document.getElementById("dots");
      var scroll = document.getElementById("scroll");
      var count = document.getElementById("count");

      RECIPES.forEach(function (r, i) {
        var words = r.name.split(" ");
        var last = words.pop();
        var h = document.createElement("p");
        h.className = "big";
        h.dataset.i = i;
        h.innerHTML = "";
        h.append(words.join(" ") + " ");
        var sp = document.createElement("span");
        sp.textContent = last;
        h.append(sp);
        titles.append(h);

        var b = document.createElement("button");
        b.type = "button";
        b.setAttribute("aria-label", "Go to " + r.name);
        b.addEventListener("click", function () {
          document.getElementById("r-" + r.slug).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
        });
        dots.append(b);

        var sec = document.createElement("section");
        sec.className = "recipe";
        sec.id = "r-" + r.slug;
        sec.dataset.i = i;
        sec.setAttribute("aria-labelledby", "h-" + r.slug);

        var fan = document.createElementNS(NS, "svg");
        fan.setAttribute("class", "corner");
        fan.setAttribute("viewBox", "0 0 100 100");
        fan.setAttribute("aria-hidden", "true");
        fan.innerHTML = fanMarkup();
        sec.append(fan);

        var num = document.createElement("div");
        num.className = "numeral";
        num.setAttribute("aria-hidden", "true");
        num.textContent = lower[i];
        sec.append(num);

        var h2 = document.createElement("h2");
        h2.id = "h-" + r.slug;
        h2.textContent = r.name;
        h2.className = "reveal";
        sec.append(h2);

        var tg = document.createElement("p");
        tg.className = "tagline reveal";
        tg.textContent = r.tagline;
        sec.append(tg);

        var dl = document.createElement("dl");
        dl.className = "meta reveal";
        [["Time", r.time], ["Yield", r.yield], ["Difficulty", r.difficulty]].forEach(function (m) {
          var d = document.createElement("div");
          var dt = document.createElement("dt");
          dt.className = "smallcaps"; dt.textContent = m[0];
          var dd = document.createElement("dd");
          dd.textContent = m[1];
          d.append(dt, dd);
          dl.append(d);
        });
        sec.append(dl);

        var ih = document.createElement("h3");
        ih.className = "smallcaps reveal"; ih.textContent = "Ingredients";
        var ul = document.createElement("ul");
        ul.className = "ingr reveal";
        r.ingredients.forEach(function (t) { var li = document.createElement("li"); li.textContent = t; ul.append(li); });
        var mh = document.createElement("h3");
        mh.className = "smallcaps reveal"; mh.textContent = "Method";
        var ol = document.createElement("ol");
        ol.className = "steps reveal";
        r.steps.forEach(function (t) { var li = document.createElement("li"); li.textContent = t; ol.append(li); });
        sec.append(ih, ul, mh, ol);
        scroll.append(sec);
      });

      var bigs = titles.querySelectorAll(".big");
      var dotBtns = dots.querySelectorAll("button");
      function activate(i) {
        bigs.forEach(function (b, k) { b.classList.toggle("on", k === i); });
        dotBtns.forEach(function (b, k) {
          b.classList.toggle("on", k === i);
          if (k === i) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
        });
        count.textContent = "no. " + lower[i] + " of " + lower[RECIPES.length - 1];
      }
      activate(0);

      if ("IntersectionObserver" in window) {
        var active = new IntersectionObserver(function (es) {
          es.forEach(function (e) { if (e.isIntersecting) activate(+e.target.dataset.i); });
        }, { rootMargin: "-45% 0px -45% 0px" });
        var reveal = new IntersectionObserver(function (es) {
          es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); reveal.unobserve(e.target); } });
        }, { rootMargin: "0px 0px -8% 0px" });
        document.querySelectorAll(".recipe").forEach(function (s) { active.observe(s); });
        document.querySelectorAll(".reveal").forEach(function (el, k) {
          el.style.transitionDelay = (k % 5) * 70 + "ms";
          reveal.observe(el);
        });
      } else {
        document.querySelectorAll(".reveal").forEach(function (el) { el.classList.add("in"); });
      }
    })();
  </script>
</body>
</html>
