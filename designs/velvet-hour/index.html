<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Velvet Hour — Three Recipes for Evening</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400;1,500&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1c0a14; --bg2: #26101c; --champagne: #e8d3a8; --rose: #c98b7b; --ivory: #f5ece0;
      --dim: rgba(245, 236, 224, .68); --line: rgba(232, 211, 168, .28);
      --display: "Bodoni Moda", "Didot", "Bodoni 72", "Playfair Display", Georgia, serif;
      --sans: "Raleway", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ivory); font-family: var(--sans); font-weight: 300; line-height: 1.75; }
    a { color: inherit; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 1px solid var(--champagne); outline-offset: 4px; }
    .smallcaps { font-variant: small-caps; letter-spacing: .28em; text-transform: lowercase; font-weight: 400; }

    .page {
      position: relative; min-height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center;
      padding: 0 clamp(1rem, 4vw, 3rem) 3rem;
      background: radial-gradient(ellipse at 20% 100%, #3a1528 0, transparent 60%), radial-gradient(ellipse at 85% 0, #2a1020 0, transparent 50%), var(--bg);
    }
    .corner { position: absolute; width: clamp(120px, 16vw, 220px); height: auto; color: var(--champagne); pointer-events: none; }
    .corner.tl { top: 0; left: 0; opacity: .5; }
    .corner.tr { top: 0; right: 0; transform: scaleX(-1); opacity: .5; }
    .corner.bl { bottom: 0; left: 0; transform: scaleY(-1); opacity: .28; }
    .corner.br { bottom: 0; right: 0; transform: scale(-1, -1); opacity: .28; }

    .back { position: absolute; top: 2rem; left: clamp(1rem, 4vw, 3rem); z-index: 2; text-decoration: none; font-size: .78rem; color: var(--champagne); transition: color .3s, letter-spacing .4s; }
    .back:hover { color: var(--rose); letter-spacing: .34em; }

    /* the title, across the top of the page */
    .head { position: relative; z-index: 1; width: min(1100px, 100%); text-align: center; padding: clamp(5rem, 13vh, 8rem) 0 clamp(1.8rem, 5vh, 3rem); }
    .kicker { color: var(--rose); font-size: .8rem; margin: 0 0 1.1rem; }
    .title { margin: 0; font-family: var(--display); font-style: italic; font-weight: 400; font-size: clamp(2.8rem, 7vw, 6.2rem); line-height: 1; letter-spacing: -.01em; color: var(--ivory); min-height: 1.05em; }
    .title span { color: var(--champagne); }
    .rule { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: 1.4rem; color: var(--champagne); }
    .rule::before, .rule::after { content: ""; width: clamp(40px, 12vw, 140px); height: 1px; background: linear-gradient(90deg, transparent, var(--line)); }
    .rule::after { transform: scaleX(-1); }
    .rule i { width: 7px; height: 7px; border: 1px solid var(--champagne); transform: rotate(45deg); }

    /* the box, centered below it, flanked by arrows */
    .deck { position: relative; z-index: 1; width: min(1060px, 100%); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: clamp(.6rem, 2vw, 1.75rem); }
    .arrow {
      width: 3.2rem; height: 3.2rem; border-radius: 50%; border: 1px solid var(--line); background: rgba(38, 16, 28, .6); color: var(--champagne);
      display: grid; place-items: center; cursor: pointer; transition: border-color .3s, background .3s, transform .3s;
    }
    .arrow svg { width: 1.1rem; height: 1.1rem; }
    .arrow:hover { border-color: var(--champagne); background: rgba(232, 211, 168, .1); }
    .arrow.prev:hover { transform: translateX(-3px); } .arrow.next:hover { transform: translateX(3px); }

    .box {
      position: relative; padding: clamp(1.6rem, 4vw, 3.2rem) clamp(1.4rem, 4vw, 3.4rem); overflow: hidden;
      border: 1px solid var(--line); background: linear-gradient(180deg, rgba(38, 16, 28, .72), rgba(28, 10, 20, .86));
      box-shadow: 0 30px 80px rgba(0, 0, 0, .45), inset 0 0 0 6px rgba(28, 10, 20, .6), inset 0 0 0 7px var(--line);
    }
    .box .fan { position: absolute; width: 90px; color: var(--rose); opacity: .45; pointer-events: none; }
    .box .fan.a { top: 0; left: 0; } .box .fan.b { bottom: 0; right: 0; transform: scale(-1, -1); }
    .numeral { position: absolute; right: .1em; bottom: -.2em; font-family: var(--display); font-style: italic; font-size: clamp(9rem, 22vw, 18rem); line-height: 1; color: var(--champagne); opacity: .05; pointer-events: none; user-select: none; }
    .box > :not(.fan):not(.numeral) { position: relative; }

    .tagline { font-family: var(--display); font-style: italic; font-size: clamp(1.1rem, 2.2vw, 1.5rem); text-align: center; color: var(--ivory); margin: 0 auto 1.6rem; max-width: 34rem; line-height: 1.5; }
    .meta { display: flex; flex-wrap: wrap; justify-content: center; gap: .8rem 3rem; margin: 0 0 2.2rem; padding: 1rem 0; border-block: 1px solid var(--line); }
    .meta div { text-align: center; }
    .meta dt { font-size: .7rem; color: var(--rose); }
    .meta dd { margin: 0; font-size: .92rem; }
    .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: clamp(1.5rem, 5vw, 4rem); }
    h3 { font-size: .8rem; color: var(--champagne); margin: 0 0 1.1rem; display: flex; align-items: center; gap: 1rem; }
    h3::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
    ul, ol { list-style: none; margin: 0; padding: 0; }
    .ingr li { padding: .5rem 0 .5rem 1.6rem; position: relative; border-bottom: 1px solid rgba(232, 211, 168, .1); font-size: .95rem; }
    .ingr li::before { content: ""; position: absolute; left: .2rem; top: 1.1rem; width: 6px; height: 6px; border: 1px solid var(--rose); transform: rotate(45deg); }
    .steps { counter-reset: s; }
    .steps li { counter-increment: s; position: relative; padding: .5rem 0 .9rem 3rem; font-size: .95rem; }
    .steps li::before { content: counter(s, upper-roman); position: absolute; left: 0; top: .35rem; font-family: var(--display); font-style: italic; font-size: 1.25rem; color: var(--rose); }

    .enter { animation: enter .8s cubic-bezier(.2, .7, .2, 1) both; }
    @keyframes enter { from { opacity: 0; transform: translateX(var(--dx, 0px)); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }

    /* count and dots below the box */
    .foot { position: relative; z-index: 1; margin-top: 1.75rem; display: flex; flex-direction: column; align-items: center; gap: .9rem; font-size: .72rem; color: var(--rose); }
    .dots { display: flex; gap: .6rem; }
    .dots button { width: 2.2rem; height: 1px; padding: 1rem 0; background: var(--line) content-box; border: 0; cursor: pointer; transition: background .4s; }
    .dots button.on, .dots button:hover { background: var(--champagne) content-box; }
    .hint { margin: 0; color: var(--dim); font-size: .78rem; letter-spacing: .06em; }
    footer { padding: 3rem 1.5rem; text-align: center; font-size: .75rem; color: var(--rose); border-top: 1px solid var(--line); background: var(--bg); }

    @media (max-width: 760px) {
      .deck { grid-template-columns: 1fr 1fr; grid-template-areas: "box box" "prev next"; }
      .box { grid-area: box; }
      .arrow.prev { grid-area: prev; justify-self: start; } .arrow.next { grid-area: next; justify-self: end; }
      .cols { grid-template-columns: 1fr; }
      .title { min-height: 2.1em; }
      .corner { width: 100px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .enter { animation: none; }
      .back, .arrow, .dots button { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <svg class="corner tl" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <svg class="corner tr" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <svg class="corner bl" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <svg class="corner br" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <a class="back smallcaps" href="../../index.html">&larr; the gallery</a>

    <header class="head">
      <p class="kicker smallcaps">after dusk &middot; before midnight</p>
      <h1 class="title" id="title" aria-live="polite"></h1>
      <div class="rule" aria-hidden="true"><i></i></div>
    </header>

    <section class="deck" aria-roledescription="carousel" aria-label="Recipes">
      <button class="arrow prev" id="prev" type="button" aria-label="Previous recipe">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M12.5 3.5 6 10l6.5 6.5"/></svg>
      </button>
      <article class="box" id="box" aria-roledescription="slide"></article>
      <button class="arrow next" id="next" type="button" aria-label="Next recipe">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M7.5 3.5 14 10l-6.5 6.5"/></svg>
      </button>
    </section>

    <div class="foot">
      <span class="smallcaps" id="count">no. i of iii</span>
      <nav class="dots" id="dots" aria-label="Choose a recipe"></nav>
      <p class="hint">Use the arrows, the &larr; &rarr; keys, or swipe.</p>
    </div>
  </div>
  <footer class="smallcaps">Made with patience &middot; served by candlelight</footer>

  <script src="../../recipes.js"></script>
  <script>
    (function () {
      var lower = ["i", "ii", "iii", "iv", "v"];
      var NS = "http://www.w3.org/2000/svg";
      var N = RECIPES.length;
      var current = 0;

      // Art Deco fan: radiating lines + concentric arcs from the top-left corner.
      function fanMarkup() {
        var s = "", i, a, r;
        for (i = 0; i <= 8; i++) {
          a = (i / 8) * Math.PI / 2;
          s += '<line x1="0" y1="0" x2="' + (96 * Math.cos(a)).toFixed(1) + '" y2="' + (96 * Math.sin(a)).toFixed(1) + '"/>';
        }
        for (r = 24; r <= 96; r += 24) {
          s += '<path d="M' + r + ' 0 A' + r + ' ' + r + ' 0 0 1 0 ' + r + '"/>';
        }
        return '<g fill="none" stroke="currentColor" stroke-width=".7">' + s + '</g>';
      }
      document.querySelectorAll("svg.corner").forEach(function (el) { el.innerHTML = fanMarkup(); });

      var titleEl = document.getElementById("title");
      var box = document.getElementById("box");
      var dots = document.getElementById("dots");
      var count = document.getElementById("count");

      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }
      function fan(cls) {
        var f = document.createElementNS(NS, "svg");
        f.setAttribute("class", "fan " + cls);
        f.setAttribute("viewBox", "0 0 100 100");
        f.setAttribute("aria-hidden", "true");
        f.innerHTML = fanMarkup();
        return f;
      }

      var dotBtns = RECIPES.map(function (r, i) {
        var b = el("button");
        b.type = "button";
        b.setAttribute("aria-label", "Go to " + r.name);
        b.addEventListener("click", function () { show(i, i > current ? 1 : -1); });
        dots.append(b);
        return b;
      });

      function retrigger(node, dir) {
        node.style.setProperty("--dx", (dir * 36) + "px");
        node.classList.remove("enter");
        void node.offsetWidth;
        node.classList.add("enter");
      }

      function show(i, dir) {
        current = (i + N) % N;
        var r = RECIPES[current];

        // title: last word in champagne, as before
        var words = r.name.split(" ");
        var last = words.pop();
        titleEl.textContent = words.join(" ") + " ";
        titleEl.append(el("span", "", last));

        // box
        box.textContent = "";
        box.setAttribute("aria-label", r.name + " (" + (current + 1) + " of " + N + ")");
        box.append(fan("a"), fan("b"));
        var num = el("div", "numeral", lower[current]);
        num.setAttribute("aria-hidden", "true");
        box.append(num);
        box.append(el("p", "tagline", r.tagline));

        var dl = el("dl", "meta");
        [["Time", r.time], ["Yield", r.yield], ["Difficulty", r.difficulty]].forEach(function (m) {
          var d = el("div");
          d.append(el("dt", "smallcaps", m[0]), el("dd", "", m[1]));
          dl.append(d);
        });
        box.append(dl);

        var cols = el("div", "cols");
        var left = el("div");
        left.append(el("h3", "smallcaps", "Ingredients"));
        var ul = el("ul", "ingr");
        r.ingredients.forEach(function (t) { ul.append(el("li", "", t)); });
        left.append(ul);
        var right = el("div");
        right.append(el("h3", "smallcaps", "Method"));
        var ol = el("ol", "steps");
        r.steps.forEach(function (t) { ol.append(el("li", "", t)); });
        right.append(ol);
        cols.append(left, right);
        box.append(cols);

        dotBtns.forEach(function (b, k) {
          b.classList.toggle("on", k === current);
          if (k === current) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
        });
        count.textContent = "no. " + lower[current] + " of " + lower[N - 1];

        if (dir) { retrigger(titleEl, dir); retrigger(box, dir); }
        history.replaceState(null, "", "#" + r.slug);
      }

      document.getElementById("prev").addEventListener("click", function () { show(current - 1, -1); });
      document.getElementById("next").addEventListener("click", function () { show(current + 1, 1); });
      document.addEventListener("keydown", function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) return;
        if (e.key === "ArrowLeft") show(current - 1, -1);
        else if (e.key === "ArrowRight") show(current + 1, 1);
      });

      // swipe on touch screens
      var x0 = null;
      box.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
      box.addEventListener("touchend", function (e) {
        if (x0 == null) return;
        var dx = e.changedTouches[0].clientX - x0;
        x0 = null;
        if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
      }, { passive: true });

      var start = 0, h = location.hash.slice(1);
      RECIPES.forEach(function (r, i) { if (r.slug === h) start = i; });
      show(start, 0);
    })();
  </script>
</body>
</html>
