<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Letters from Grandma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    :root {
      --felt: #3b5546; --cream: #fbf6e6; --env: #f1e7cc; --ink: #25365a; --red: #b8332e; --blue: #2c4e7a; --stamp: #d98c3f;
      --type: "Special Elite", "Courier New", Courier, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 1rem 1rem 4rem; color: var(--ink); font-family: var(--type);
      /* green desk blotter with a faint woven texture */
      background-color: var(--felt);
      background-image: repeating-linear-gradient(45deg, rgb(255 255 255 / .035) 0 2px, transparent 2px 5px), repeating-linear-gradient(-45deg, rgb(0 0 0 / .05) 0 2px, transparent 2px 5px);
    }
    :focus-visible { outline: 3px dashed #f3d98a; outline-offset: 4px; }
    .back { display: inline-block; font-size: 1rem; color: #f1e7cc; text-decoration: none; letter-spacing: .04em; }
    .back:hover { text-decoration: underline; }

    .wrap { width: min(920px, 100%); margin: 0 auto; }
    h1 { font-weight: 400; font-size: clamp(2rem, 7vw, 3.5rem); color: #f7edcf; margin: .6rem 0 0; text-align: center; line-height: 1.1; letter-spacing: .03em; text-shadow: 0 2px 0 rgb(0 0 0 / .3); }
    .sub { text-align: center; font-size: .8rem; letter-spacing: .3em; text-transform: uppercase; color: #c8d3bd; margin: .8rem 0 0; }

    /* ---- the envelopes ---- */
    .mail { display: flex; justify-content: center; gap: clamp(.6rem, 2.5vw, 1.8rem); padding: 4.5rem 0 1rem; }
    .env {
      position: relative; flex: none; padding: 0; cursor: pointer; text-align: left; color: var(--ink); font-family: var(--type);
      width: clamp(104px, 28vw, 270px); aspect-ratio: 3 / 2; background: var(--env);
      box-shadow: 0 6px 14px rgb(0 0 0 / .35); transition: transform .4s cubic-bezier(.3, 1.4, .5, 1);
      /* airmail border */
      border: 7px solid transparent;
      border-image: repeating-linear-gradient(135deg, var(--red) 0 12px, var(--env) 12px 20px, var(--blue) 20px 32px, var(--env) 32px 40px) 7;
    }
    .env:nth-child(1) { transform: rotate(-3deg); } .env:nth-child(2) { transform: rotate(1.5deg); } .env:nth-child(3) { transform: rotate(-1deg); }
    .env:hover { transform: translateY(-6px) rotate(0); }
    .env[aria-selected="true"] { transform: translateY(-12px) rotate(0); }
    .env-in { position: absolute; inset: 0; padding: .45rem .6rem; }
    .ret { font-size: clamp(.45rem, 1.1vw, .62rem); line-height: 1.3; color: #5a5a66; white-space: pre-line; }
    .addr { position: absolute; left: 24%; right: 6%; bottom: 12%; font-size: clamp(.5rem, 1.4vw, .85rem); line-height: 1.3; }
    .addr b { display: block; font-weight: 400; font-size: clamp(.6rem, 1.8vw, 1.05rem); line-height: 1.2; color: var(--red); }
    .stamp {
      position: absolute; top: .4rem; right: .5rem; width: clamp(24px, 6vw, 46px); aspect-ratio: 4 / 5; background: var(--c, var(--stamp));
      -webkit-mask: radial-gradient(circle 3px at 50% 0, #0000 98%, #000) 0 0 / 6px 100% repeat-x; mask: radial-gradient(circle 3px at 50% 0, #0000 98%, #000) 0 0 / 6px 100% repeat-x;
      box-shadow: inset 0 0 0 3px #fff8e2; display: grid; place-items: center; font-size: clamp(.4rem, 1vw, .6rem); color: #fff8e2;
    }
    .stamp::after { content: "5¢"; }
    .mark {
      position: absolute; top: .55rem; right: clamp(28px, 7vw, 56px); width: clamp(34px, 8vw, 62px); aspect-ratio: 1; border: 2px solid rgb(40 40 60 / .45); border-radius: 50%;
      display: grid; place-items: center; font-size: clamp(.3rem, .8vw, .5rem); text-align: center; line-height: 1.1; color: rgb(40 40 60 / .55); transform: rotate(-12deg); text-transform: uppercase;
    }
    .flap { position: absolute; left: -7px; right: -7px; top: -7px; height: 60%; background: #e6d9b8; clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transition: transform .5s ease, background .3s; filter: drop-shadow(0 2px 2px rgb(0 0 0 / .25)); }
    .env[aria-selected="true"] .flap { transform: scaleY(-1); background: #d9ccaa; }
    .seal { position: absolute; left: 50%; top: 52%; width: clamp(16px, 3.6vw, 30px); aspect-ratio: 1; margin-left: calc(clamp(16px, 3.6vw, 30px) / -2); border-radius: 50%; background: radial-gradient(circle at 35% 30%, #d4534b, var(--red) 60%, #7e1f1b); display: grid; place-items: center; color: #f3c2bd; font-size: clamp(.5rem, 1.4vw, .9rem); box-shadow: 0 2px 3px rgb(0 0 0 / .4); transition: opacity .3s; z-index: 2; }
    .env[aria-selected="true"] .seal { opacity: 0; }

    /* ---- the letter ---- */
    .letter-stage { perspective: 1400px; margin-top: 1.6rem; }
    .letter {
      position: relative; width: min(740px, 100%); margin: 0 auto; background: var(--cream); color: var(--ink);
      box-shadow: 0 18px 34px rgb(0 0 0 / .45); outline: 1px solid rgb(120 90 50 / .35); outline-offset: -12px;
    }
    .fold { padding: clamp(1.4rem, 5vw, 2.6rem) clamp(1.6rem, 6vw, 3.4rem); position: relative; transform-origin: top center; backface-visibility: hidden; }
    .fold + .fold { border-top: 1px dashed rgb(90 70 40 / .25); background-image: linear-gradient(rgb(90 70 40 / .07), transparent 46px); }
    .letter.unfold .fold { animation: unfold .7s cubic-bezier(.2, .8, .3, 1) both; }
    .letter.unfold .fold:nth-child(2) { animation-delay: .18s; } .letter.unfold .fold:nth-child(3) { animation-delay: .36s; }
    @keyframes unfold { from { transform: rotateX(-92deg); opacity: 0; } to { transform: none; opacity: 1; } }

    .date { font-size: .72rem; letter-spacing: .15em; text-transform: uppercase; color: #6c6a74; margin: 0 0 1.2rem; }
    .greet { font-size: clamp(1.3rem, 3.8vw, 1.8rem); margin: 0 0 .6rem; line-height: 1.2; color: var(--red); }
    .letter p { margin: 0 0 .9rem; font-size: clamp(.92rem, 2.2vw, 1.05rem); line-height: 1.75; }
    h2 { font-weight: 400; font-size: clamp(1.3rem, 4vw, 1.9rem); text-transform: uppercase; letter-spacing: .05em; margin: 1.1rem 0 .2rem; line-height: 1.15; }
    .letter .known { font-size: clamp(.8rem, 2vw, .92rem); color: #4b5a78; margin: .8rem 0 0; line-height: 1.7; }
    .known span + span::before { content: " · "; }
    h3 { font-weight: 400; font-size: clamp(1rem, 2.8vw, 1.25rem); text-transform: uppercase; letter-spacing: .12em; color: var(--blue); margin: 0 0 .7rem; padding-bottom: .3rem; border-bottom: 1px dotted var(--blue); }
    ul.want { list-style: none; margin: 0; padding: 0; }
    ul.want li { font-size: clamp(.92rem, 2.2vw, 1.05rem); line-height: 1.55; }
    ul.want label { display: flex; align-items: baseline; gap: .7rem; cursor: pointer; padding: .22rem 0; }
    ul.want input { appearance: none; width: 1.05rem; height: 1.05rem; flex: none; margin: 0; border: 2px solid var(--ink); border-radius: 50%; transform: translateY(.18rem); cursor: pointer; position: relative; }
    ul.want input:checked { border-color: var(--red); background: radial-gradient(circle, var(--red) 0 42%, transparent 46%); }
    ul.want input:checked + span { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; color: #6d7690; }
    ol.how { list-style: none; counter-reset: s; margin: 0; padding: 0; }
    ol.how li { counter-increment: s; padding-left: 2.2rem; position: relative; margin-bottom: .75rem; font-size: clamp(.92rem, 2.2vw, 1.05rem); line-height: 1.7; }
    ol.how li::before { content: counter(s) "."; position: absolute; left: 0; top: 0; font-size: 1.05rem; color: var(--red); }
    .letter .signoff { font-size: clamp(1.05rem, 3vw, 1.3rem); margin: 1.6rem 0 .2rem; color: var(--blue); line-height: 1.3; }
    .letter .ps { font-size: clamp(.88rem, 2.1vw, 1rem); color: var(--red); margin: .6rem 0 0; transform: rotate(-.8deg); }
    .flower { position: absolute; top: 14px; right: 16px; width: 64px; opacity: .85; transform: rotate(14deg); pointer-events: none; }
    .hint { text-align: center; font-size: .85rem; color: #d7e2cc; margin: 1.6rem 0 0; letter-spacing: .04em; }

    @media (max-width: 640px) {
      .mail { padding-top: 3rem; }
      .ret, .mark { display: none; }
      .addr { left: 10%; bottom: 8%; }
      .env-in { padding: .3rem; }
      .flower { width: 44px; }
    }
    @media (prefers-reduced-motion: reduce) { .letter.unfold .fold { animation: none; } .env, .flap, .seal { transition: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../../index.html">&larr; back to the gallery</a>
    <h1>Letters from Grandma</h1>
    <p class="sub">Three letters &middot; Open one</p>

    <div class="mail" role="tablist" aria-label="Letters" id="mail"></div>

    <div class="letter-stage">
      <article class="letter" id="letter" role="tabpanel" aria-live="polite"></article>
    </div>
    <p class="hint">Tap the circles to cross things off as you gather them.</p>
  </div>

  <script src="../../recipes.js"></script>
  <script>
    (function () {
      // Grandma's voice, keyed by recipe slug (the recipe text itself comes from recipes.js)
      var VOICE = {
        "sourdough": { dear: "Dear Sweet Pea,", intro: "I fed the starter this morning and thought of you. This is the loaf I make when the whole house wants to slow down.", ps: "P.S. Don't rush the folds, honey. Patience!" },
        "focaccia": { dear: "Dear Sweet Pea,", intro: "This one is for Sundays and for too many guests. It forgives nearly everything, which is more than I can say for most of us.", ps: "P.S. More oil than you think. Then a bit more." },
        "chocolate-chip-cookies": { dear: "Dear Sweet Pea,", intro: "The cookie jar has been empty far too long. Here is how we fill it again, and quickly.", ps: "P.S. Chill the dough! Yes, really." }
      };
      var STAMPS = ["#d98c3f", "#4f7f6a", "#a65a7a"];
      var mail = document.getElementById("mail");
      var letter = document.getElementById("letter");
      var current = 0, envs = [];

      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }

      RECIPES.forEach(function (r, i) {
        var b = el("button", "env");
        b.type = "button";
        b.id = "env-" + i;
        b.setAttribute("role", "tab");
        b.style.setProperty("--c", STAMPS[i % STAMPS.length]);
        b.innerHTML =
          '<span class="flap" aria-hidden="true"></span>' +
          '<span class="env-in">' +
            '<span class="ret" aria-hidden="true">Grandma\nOven Road</span>' +
            '<span class="mark" aria-hidden="true">Baked<br>with<br>love</span>' +
            '<span class="stamp" aria-hidden="true"></span>' +
            '<span class="addr"><b></b><span></span></span>' +
          '</span>' +
          '<span class="seal" aria-hidden="true">G</span>';
        b.querySelector(".addr b").textContent = "Sweet Pea";
        b.querySelector(".addr span").textContent = r.name;
        b.addEventListener("click", function () { show(i, true); });
        mail.appendChild(b);
        envs.push(b);
      });

      function show(i, animate) {
        current = (i + RECIPES.length) % RECIPES.length;
        var r = RECIPES[current];
        var v = VOICE[r.slug] || { dear: "Dear you,", intro: r.tagline, ps: "" };
        letter.setAttribute("aria-labelledby", "env-" + current);
        letter.textContent = "";

        // fold 1: greeting
        var f1 = el("section", "fold");
        f1.innerHTML = '<svg class="flower" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><g fill="#d9a3b0" stroke="#a96a7a" stroke-width="1"><ellipse cx="32" cy="14" rx="8" ry="12"/><ellipse cx="32" cy="14" rx="8" ry="12" transform="rotate(72 32 32)"/><ellipse cx="32" cy="14" rx="8" ry="12" transform="rotate(144 32 32)"/><ellipse cx="32" cy="14" rx="8" ry="12" transform="rotate(216 32 32)"/><ellipse cx="32" cy="14" rx="8" ry="12" transform="rotate(288 32 32)"/></g><circle cx="32" cy="32" r="6" fill="#e9c46a" stroke="#b08a2e"/></svg>';
        f1.appendChild(el("p", "date", "Letter no. " + (current + 1) + " — written at the kitchen table"));
        f1.appendChild(el("p", "greet", v.dear));
        f1.appendChild(el("p", "", v.intro));
        f1.appendChild(el("h2", "", r.name));
        var known = el("p", "known");
        ["Takes " + r.time, "Makes " + r.yield, "Skill: " + r.difficulty].forEach(function (t) { known.appendChild(el("span", "", t)); });
        f1.appendChild(known);

        // fold 2: ingredients
        var f2 = el("section", "fold");
        f2.appendChild(el("h3", "", "You'll want:"));
        var ul = el("ul", "want");
        r.ingredients.forEach(function (t) {
          var li = el("li");
          var lab = el("label");
          var cb = el("input"); cb.type = "checkbox";
          lab.appendChild(cb); lab.appendChild(el("span", "", t));
          li.appendChild(lab); ul.appendChild(li);
        });
        f2.appendChild(ul);

        // fold 3: method and sign-off
        var f3 = el("section", "fold");
        f3.appendChild(el("h3", "", "Here's how:"));
        var ol = el("ol", "how");
        r.steps.forEach(function (t) { ol.appendChild(el("li", "", t)); });
        f3.appendChild(ol);
        f3.appendChild(el("p", "signoff", "With all my love, Grandma"));
        if (v.ps) f3.appendChild(el("p", "ps", v.ps));

        letter.appendChild(f1); letter.appendChild(f2); letter.appendChild(f3);

        envs.forEach(function (e, k) {
          e.setAttribute("aria-selected", k === current ? "true" : "false");
          e.tabIndex = k === current ? 0 : -1;
        });
        letter.classList.remove("unfold");
        if (animate) { void letter.offsetWidth; letter.classList.add("unfold"); }
      }

      mail.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
          show(current + (e.key === "ArrowRight" ? 1 : -1), true);
          envs[current].focus();
        }
      });
      var start = 0, h = location.hash.slice(1);
      RECIPES.forEach(function (r, i) { if (r.slug === h) start = i; });
      show(start, true);
    })();
  </script>
</body>
</html>
